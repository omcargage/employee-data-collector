[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edc-agent"
version = "0.1.0"
description = "Employee Data Collector (EDC) desktop agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pynput>=1.7.6",
    "tomli-w>=1.0.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
edc = "edc_agent.main:cli_entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../shared"]
