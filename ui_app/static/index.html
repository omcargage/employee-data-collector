<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkSense — Early-Warning Burnout Prevention</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Design Tokens (CSS Variables: Light and Dark set) -->
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Light Theme */
      --bg-app: #F7F6F3;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #F0EFEA;
      --bg-card-hover: #FAF9F6;
      --border-subtle: #E8E6DF;
      --border-strong: #D5D2C8;
      --text-primary: #181816;
      --text-secondary: #5E5C56;
      --text-muted: #8A8880;

      --primary: #1F5C63;
      --primary-hover: #17484E;
      --primary-subtle: rgba(31, 92, 99, 0.08);
      --primary-border: rgba(31, 92, 99, 0.2);
      --primary-text: #FFFFFF;

      /* Status Colors (always paired with icon + word) */
      /* Steady = sage */
      --status-steady: #4E7A58;
      --status-steady-bg: #EDF4EF;
      --status-steady-border: #C8DEC9;

      /* Stretched = sand */
      --status-stretched: #B58934;
      --status-stretched-bg: #FBF5E8;
      --status-stretched-border: #EFE0BD;

      /* Strained = terracotta */
      --status-strained: #C45A38;
      --status-strained-bg: #FAECE6;
      --status-strained-border: #F1CBBF;

      /* Overloaded = deep rose */
      --status-overloaded: #A8384E;
      --status-overloaded-bg: #F7E8EB;
      --status-overloaded-border: #ECC1CA;

      /* Calibrating / Neutral = slate */
      --status-calibrating: #4A6572;
      --status-calibrating-bg: #EDF2F4;
      --status-calibrating-border: #CFD8DC;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 18px;
      --radius-pill: 9999px;

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card: 0 3px 14px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.05), 0 -1px 3px rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] {
      --bg-app: #151615;
      --bg-sidebar: #1C1E1C;
      --bg-card: #222422;
      --bg-card-subtle: #2B2E2B;
      --bg-card-hover: #272A27;
      --border-subtle: #2F332F;
      --border-strong: #404540;
      --text-primary: #F3F3F1;
      --text-secondary: #B1AFA7;
      --text-muted: #7E7C74;

      --primary: #3CA1AC;
      --primary-hover: #4EB4BF;
      --primary-subtle: rgba(60, 161, 172, 0.15);
      --primary-border: rgba(60, 161, 172, 0.3);
      --primary-text: #FFFFFF;

      --status-steady: #68A074;
      --status-steady-bg: rgba(78, 122, 88, 0.2);
      --status-steady-border: rgba(104, 160, 116, 0.35);

      --status-stretched: #D4A853;
      --status-stretched-bg: rgba(181, 137, 52, 0.2);
      --status-stretched-border: rgba(212, 168, 83, 0.35);

      --status-strained: #DE7755;
      --status-strained-bg: rgba(196, 90, 56, 0.2);
      --status-strained-border: rgba(222, 119, 85, 0.35);

      --status-overloaded: #C6546B;
      --status-overloaded-bg: rgba(168, 56, 78, 0.2);
      --status-overloaded-border: rgba(198, 84, 107, 0.35);

      --status-calibrating: #7C98A6;
      --status-calibrating-bg: rgba(74, 101, 114, 0.2);
      --status-calibrating-border: rgba(124, 152, 166, 0.35);

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .ws-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ws-btn-primary {
      background-color: var(--primary);
      color: var(--primary-text);
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 38px;
      text-decoration: none;
    }

    .ws-btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .ws-btn-secondary {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 38px;
      text-decoration: none;
    }

    .ws-btn-secondary:hover {
      background-color: var(--bg-card-subtle);
    }

    .ws-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .ws-skeleton {
      background: linear-gradient(90deg, var(--bg-card-subtle) 25%, var(--bg-card-hover) 50%, var(--bg-card-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 9999px;
    }
  </style>

  <!-- React 18, ReactDOM, and Babel Standalone for in-browser compilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // STATUS METADATA: ALWAYS ICON + WORD (NEVER COLOR ALONE)
    // Sage = Steady, Sand = Stretched, Terracotta = Strained, Deep Rose = Overloaded
    // =========================================================================
    const STATUS_META = {
      Green: {
        word: "Steady",
        color: "var(--status-steady)",
        bg: "var(--status-steady-bg)",
        border: "var(--status-steady-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        sentence: "Your work pattern is steady and matching your usual pace. Keep up your balanced rhythm.",
        action: "Maintain your regular lunch and stretch blocks today."
      },
      Yellow: {
        word: "Stretched",
        color: "var(--status-stretched)",
        bg: "var(--status-stretched-bg)",
        border: "var(--status-stretched-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        ),
        sentence: "Your work pattern has shifted a little from your usual. Nothing urgent, but protect your breaks this week.",
        action: "Block out a 15-minute quiet recovery window this afternoon."
      },
      Orange: {
        word: "Strained",
        color: "var(--status-strained)",
        bg: "var(--status-strained-bg)",
        border: "var(--status-strained-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        ),
        sentence: "Your work pattern shows noticeable strain building up across recent days. Prioritize recovery and protect your boundaries.",
        action: "End work at your scheduled shift time tonight with no late emails."
      },
      Red: {
        word: "Overloaded",
        color: "var(--status-overloaded)",
        bg: "var(--status-overloaded-bg)",
        border: "var(--status-overloaded-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        ),
        sentence: "Your working rhythms show sustained high fatigue and boundary erosion. Consider speaking with your team and taking restorative rest.",
        action: "Speak with your team lead about workload rebalancing and step away for an extended pause."
      },
      INSUFFICIENT_DATA: {
        word: "No status today",
        color: "var(--status-calibrating)",
        bg: "var(--status-calibrating-bg)",
        border: "var(--status-calibrating-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M20 12H4" />
          </svg>
        ),
        sentence: "No telemetry recorded today or weekend rest day. Enjoy your time away from the screen.",
        action: "Rest and recharge."
      }
    };

    // BAT-12 Short Version Questionnaire
    const BAT12_QUESTIONS = [
      { id: 1, key: "bat_q1", dim: "Exhaustion", text: "At work, I feel mentally exhausted" },
      { id: 2, key: "bat_q2", dim: "Exhaustion", text: "After a day at work, I find it hard to recover my energy" },
      { id: 3, key: "bat_q3", dim: "Exhaustion", text: "At work, I feel physically exhausted" },
      { id: 4, key: "bat_q4", dim: "Mental distance", text: "I struggle to find any enthusiasm for my work" },
      { id: 5, key: "bat_q5", dim: "Mental distance", text: "I feel a strong aversion towards my job" },
      { id: 6, key: "bat_q6", dim: "Mental distance", text: "I'm cynical about what my work means to others" },
      { id: 7, key: "bat_q7", dim: "Emotional impairment", text: "At work, I feel unable to control my emotions" },
      { id: 8, key: "bat_q8", dim: "Emotional impairment", text: "I do not recognize myself in the way I react emotionally at work" },
      { id: 9, key: "bat_q9", dim: "Emotional impairment", text: "At work I may overreact unintentionally" },
      { id: 10, key: "bat_q10", dim: "Cognitive impairment", text: "At work, I have trouble staying focused" },
      { id: 11, key: "bat_q11", dim: "Cognitive impairment", text: "When I'm working, I have trouble concentrating" },
      { id: 12, key: "bat_q12", dim: "Cognitive impairment", text: "I make mistakes in my work because I have my mind on other things" }
    ];

    // 4 Groups of BAT-12 (One group per step in Day Check-in form)
    const BAT12_GROUPS = [
      {
        step: 1,
        key: "exhaustion",
        title: "Exhaustion",
        subtitle: "Physical and cognitive energy recovery after your workday.",
        questions: BAT12_QUESTIONS.slice(0, 3)
      },
      {
        step: 2,
        key: "mental_distance",
        title: "Mental distance",
        subtitle: "Psychological withdrawal and enthusiasm for your daily work.",
        questions: BAT12_QUESTIONS.slice(3, 6)
      },
      {
        step: 3,
        key: "emotional_impairment",
        title: "Emotional impairment",
        subtitle: "Emotional regulation and composure during work situations.",
        questions: BAT12_QUESTIONS.slice(6, 9)
      },
      {
        step: 4,
        key: "cognitive_impairment",
        title: "Cognitive impairment",
        subtitle: "Concentration, working memory, and focus stamina.",
        questions: BAT12_QUESTIONS.slice(9, 12)
      }
    ];

    // =========================================================================
    // HELPER: Friendly Unit Formatter ("1h 26m", not "86.4 mins")
    // =========================================================================
    function toFriendlyUnits(metricKey, val) {
      if (val === undefined || val === null) return "--";
      const num = Number(val);
      if (isNaN(num)) return val;

      if (["stretch", "stretch_mins", "lunch", "lunch_mins", "focus", "focus_mins", "after_hours_mins"].includes(metricKey)) {
        const mins = Math.round(num);
        if (mins >= 60) {
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }
        return `${mins}m`;
      }
      if (metricKey === "after_hours_msgs") {
        return `${Math.round(num)} msgs`;
      }
      if (metricKey === "wpm") {
        return `${Math.round(num)} WPM`;
      }
      if (metricKey === "backspace_ratio") {
        return `${num.toFixed(1)}%`;
      }
      if (["mouse", "mouse_speed"].includes(metricKey)) {
        return `${Math.round(num)} px/s`;
      }
      return `${num}`;
    }

    // =========================================================================
    // REUSABLE COMPONENT: Skeleton
    // =========================================================================
    function Skeleton({ type = "card", count = 1, className = "" }) {
      if (type === "text") {
        return (
          <div className={`space-y-2.5 ${className}`}>
            {Array.from({ length: count }).map((_, i) => (
              <div key={i} className="h-4 ws-skeleton" style={{ width: i === 0 ? "80%" : "60%" }} />
            ))}
          </div>
        );
      }
      return (
        <div className={`space-y-4 ${className}`}>
          {Array.from({ length: count }).map((_, i) => (
            <div key={i} className="ws-card p-6 space-y-3">
              <div className="h-5 w-48 ws-skeleton" />
              <div className="h-4 w-full ws-skeleton" />
              <div className="h-4 w-3/4 ws-skeleton" />
            </div>
          ))}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: EmptyState
    // =========================================================================
    function EmptyState({ icon, title, description, actionText, onAction }) {
      return (
        <div className="ws-card p-10 text-center flex flex-col items-center justify-center">
          <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-4" style={{ backgroundColor: "var(--primary-subtle)", color: "var(--primary)" }}>
            {icon || (
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            )}
          </div>
          <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">{title}</h3>
          <p className="text-sm text-[var(--text-secondary)] max-w-md mb-5 leading-relaxed">{description}</p>
          {actionText && onAction && (
            <button onClick={onAction} className="ws-btn-primary">
              {actionText}
            </button>
          )}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: DeviationBar
    // Center = "Your usual", Bands: Typical / A bit different / Much different
    // Shows "changed" instead of "worse" for ambiguous metrics (typing speed).
    // Exact numbers on hover.
    // =========================================================================
    function DeviationBar({ item }) {
      const [hovered, setHovered] = useState(false);
      const val = item.value || 0;
      const absVal = Math.abs(val);

      let bandLabel = "Typical";
      let bandColor = "var(--text-secondary)";
      let bandBg = "var(--bg-card-subtle)";
      let barColor = "var(--border-strong)";

      if (absVal >= 2.5) {
        bandLabel = "Much different";
        bandColor = "var(--status-overloaded)";
        bandBg = "var(--status-overloaded-bg)";
        barColor = "var(--status-overloaded)";
      } else if (absVal >= 1.2) {
        bandLabel = "A bit different";
        bandColor = "var(--status-stretched)";
        bandBg = "var(--status-stretched-bg)";
        barColor = "var(--status-stretched)";
      }

      const clampedPct = Math.min(48, (absVal / 5.0) * 48);

      return (
        <div
          className="p-3.5 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card)] relative transition-all hover:border-[var(--border-strong)]"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div className="flex items-center justify-between text-xs mb-1.5">
            <span className="font-semibold text-[var(--text-primary)]">{item.displayLabel}</span>
            <span
              className="px-2 py-0.5 rounded-full text-[11px] font-medium"
              style={{ backgroundColor: bandBg, color: bandColor }}
            >
              {bandLabel}
            </span>
          </div>

          <div className="relative h-2.5 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden my-2">
            <div className="absolute top-0 bottom-0 left-1/2 w-0.5 bg-[var(--text-muted)] z-10" />

            {val < 0 ? (
              <div
                className="absolute top-0 bottom-0 rounded-l-full transition-all duration-300"
                style={{
                  right: "50%",
                  width: `${clampedPct}%`,
                  backgroundColor: barColor
                }}
              />
            ) : (
              <div
                className="absolute top-0 bottom-0 rounded-r-full transition-all duration-300"
                style={{
                  left: "50%",
                  width: `${clampedPct}%`,
                  backgroundColor: barColor
                }}
              />
            )}
          </div>

          <div className="flex justify-between items-center text-[10px] text-[var(--text-muted)]">
            <span>Lower</span>
            <span className="font-semibold text-[var(--text-secondary)]">Your usual</span>
            <span>Higher</span>
          </div>

          {hovered && (
            <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1 px-2.5 rounded-lg shadow-lg whitespace-nowrap z-30 pointer-events-none">
              <span className="font-semibold">{item.hoverMetric}</span> &bull; {val > 0 ? `+${val}` : val} MAD from usual
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: MetricTrendLineCard
    // Metric card with line chart, shaded "your normal" band, 7/30d toggle,
    // friendly units, and "What this means".
    // =========================================================================
    function MetricTrendLineCard({
      title,
      metricKey,
      meaningSentence,
      data7d = [],
      data30d = [],
      baselineBand = { median: 50, min: 30, max: 70 },
      timeRange = "7d", // "7d" or "30d"
      onToggleTimeRange
    }) {
      const [hoveredPoint, setHoveredPoint] = useState(null);

      // Select active telemetry slice
      const activeData = timeRange === "7d" ? data7d : data30d;
      const latestItem = activeData[activeData.length - 1] || {};
      const todayRawVal = latestItem[metricKey] || 0;
      const todayFriendlyVal = toFriendlyUnits(metricKey, todayRawVal);

      // SVG Dimensions
      const width = 460;
      const height = 150;
      const padTop = 18;
      const padBottom = 26;
      const padLeft = 24;
      const padRight = 24;
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      // Extract values to compute scale
      const values = activeData.map(d => Number(d[metricKey]) || 0);
      const bMin = baselineBand.min !== undefined ? baselineBand.min : 0;
      const bMax = baselineBand.max !== undefined ? baselineBand.max : 100;

      const minVal = Math.max(0, Math.min(bMin * 0.85, ...values));
      const maxVal = Math.max(bMax * 1.15, ...values, 10);
      const rangeVal = maxVal - minVal || 1;

      const getX = (idx) => padLeft + (idx / Math.max(1, activeData.length - 1)) * chartW;
      const getY = (v) => padTop + chartH - ((Math.max(minVal, Math.min(maxVal, v)) - minVal) / rangeVal) * chartH;

      // Shaded Band coordinates
      const bandTopY = getY(bMax);
      const bandBottomY = getY(bMin);
      const bandHeight = Math.max(4, bandBottomY - bandTopY);

      // Generate Line Path
      const points = activeData.map((d, i) => ({
        x: getX(i),
        y: getY(Number(d[metricKey]) || 0),
        val: d[metricKey],
        date: d.date,
        dayName: d.day_name,
        isWeekend: d.is_weekend
      }));

      const linePath = points.length > 0
        ? points.reduce((acc, pt, i) => `${acc} ${i === 0 ? "M" : "L"} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`, "")
        : "";

      return (
        <div className="ws-card p-5 flex flex-col justify-between">
          <div>
            {/* Top Row: Metric Title, Friendly Today Value & Time Range Toggle */}
            <div className="flex items-start justify-between gap-3 mb-2">
              <div>
                <h4 className="text-sm font-semibold text-[var(--text-primary)]">{title}</h4>
                <div className="flex items-baseline gap-2 mt-0.5">
                  <span className="text-xl font-bold text-[var(--text-primary)]">{todayFriendlyVal}</span>
                  <span className="text-[11px] text-[var(--text-muted)]">today</span>
                </div>
              </div>

              {/* 7/30d Segmented Toggle */}
              <div className="flex items-center bg-[var(--bg-card-subtle)] p-0.5 rounded-full border border-[var(--border-subtle)] text-[11px] shrink-0">
                <button
                  type="button"
                  onClick={() => onToggleTimeRange("7d")}
                  className={`px-2.5 py-0.5 rounded-full font-medium transition-all ${
                    timeRange === "7d"
                      ? "bg-[var(--primary)] text-white shadow-xs font-semibold"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}

    // =========================================================================

    function Last7DaysTableModal({ telemetry7d = [], onClose }) {
      const handleExportCSV = () => {
        const headers = ["Date", "Longest stretch", "Midday break", "After-hours messages", "Typing speed", "Corrections", "Check-in"];
        const rows = telemetry7d.map(r => [
          r.date,
          toFriendlyUnits("stretch", r.stretch_mins),
          toFriendlyUnits("lunch", r.lunch_mins),
          r.after_hours_msgs,
          `${r.wpm} WPM`,
          `${r.backspace_ratio}%`,
          r.bat_status || "Steady"
        ]);

        const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "worksense_last_7_days.csv");
        document.body.appendChild(link);
        link.click();

    // =========================================================================
    // SECTION 2: OUTLOOK CARD (Or Calibration Card for Days 1–14)
    // =========================================================================
    function OutlookOrCalibrationCard({ data }) {
      const [howExpanded, setHowExpanded] = useState(false);

      const {
        predicted_status_5d,
        confidence = 0.9,
        risk_score = 0.2,
        calibration_progress,
      } = data;

      const daysCollected = calibration_progress ? calibration_progress.days_collected : 14;
      const daysRequired = calibration_progress ? calibration_progress.days_required : 14;
      const isCalibrationMode = !calibration_progress.is_calibrated || daysCollected < 14;

      if (isCalibrationMode) {
        const pct = calibration_progress.progress_pct || Math.round((daysCollected / daysRequired) * 100);
        const radius = 38;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - (pct / 100) * circumference;

        return (
          <div className="ws-card p-6 border-l-4" style={{ borderLeftColor: "var(--status-calibrating)" }}>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-6">

                <span className="text-xs font-semibold text-[var(--status-calibrating)] uppercase tracking-wider">

                <h2 className="text-xl font-bold text-[var(--text-primary)]">
                  Learning your normal: day {daysCollected} of {daysRequired}
                </h2>
                <p className="text-sm text-[var(--text-secondary)] max-w-xl leading-relaxed">

                <div className="text-xs text-[var(--text-muted)] pt-1">

              </div>

              <div className="relative shrink-0 flex items-center justify-center">
                <svg className="w-24 h-24 transform -rotate-90" viewBox="0 0 100 100">
                  <circle
                    cx="50"
                    cy="50"
                    r={radius}
                    stroke="var(--bg-card-subtle)"
                    strokeWidth="8"
                    fill="transparent"
                  />
                  <circle
                    cx="50"
                    cy="50"
                    r={radius}
                    stroke="var(--status-calibrating)"
                    strokeWidth="8"
                    strokeDasharray={circumference}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    fill="transparent"
                    style={{ transition: "stroke-dashoffset 0.5s ease" }}
                  />
                </svg>
                <div className="absolute text-center">
                  <div className="text-base font-bold text-[var(--text-primary)]">Day {daysCollected}</div>
                  <div className="text-[10px] text-[var(--text-muted)]">of {daysRequired}</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const meta = STATUS_META[predicted_status_5d] || STATUS_META.Green;
      const confidenceLabel = confidence >= 0.85 ? "High" : confidence >= 0.70 ? "Medium" : "Low";

              style={{ backgroundColor: meta.bg, color: meta.color, borderColor: meta.border }}

              {meta.icon}
              <span>{meta.word}</span>
            </div>
          </div>

          <p className="text-sm text-[var(--text-primary)] leading-relaxed font-medium mb-3">
            {meta.sentence}
          </p>

          <div className="p-3.5 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card-subtle)] text-xs text-[var(--text-secondary)] mb-4">

              <svg

                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            {howExpanded && (
              <div className="mt-3 p-3.5 rounded-xl bg-[var(--bg-card-subtle)] border border-[var(--border-subtle)] text-xs space-y-2 text-[var(--text-secondary)]">
                <div className="flex items-center justify-between">
                  <span>Model confidence:</span>
                  <strong className="text-[var(--text-primary)]">{confidenceLabel} ({(confidence * 100).toFixed(0)}%)</strong>
                </div>
                <div className="flex items-center justify-between">
                  <span>Burnout risk index:</span>
                  <strong className="text-[var(--text-primary)]">{riskFormatted} / 10</strong>
                </div>
                <p className="text-[11px] text-[var(--text-muted)] pt-1 border-t border-[var(--border-subtle)] leading-relaxed">
                  Based on deviations from your personal 14-day baseline across typing rhythm, session stretch lengths, and after-hours communication.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 3: DAY CHECK-IN CARD (With Timing Rules)
    // Card Title: "How was your day?"
    // Timing rules:
    // (a) Before 1:00 PM: card locked: "Opens at 1:00 PM so it reflects your day."
    //     Beside it text button: "Logging off early? Check in now."
    // (b) Tapping early unlocks form, sets early_checkin = true, saves timestamp
    // (c) After unlock time: primary button "Take today's check-in (about 2 minutes)"
    // (d) Also unlock automatically if tracking paused or no activity for 60m after 11:00 AM
    // (e) One submission per day; editable until midnight; afterwards show "Done today ✓" with "1.8 out of 5 (low)"
    // =========================================================================
    function CheckInCard({ summary, onOpenModal, isTrackingPaused = false, isInactiveAfter11AM = false }) {
      const [testOverride, setTestOverride] = useState(null); // null, "locked", "unlocked", "paused"

      const now = new Date();
      const realHour = now.getHours();

      let effectiveHour = realHour;
      let effectivePaused = isTrackingPaused;

      if (testOverride === "locked") {
        effectiveHour = 10;
        effectivePaused = false;
      } else if (testOverride === "unlocked") {
        effectiveHour = 14;
      } else if (testOverride === "paused") {
        effectivePaused = true;
      }

      // Rule (a) & (c): 1:00 PM local time (13:00)
      const isPastUnlockTime = effectiveHour >= 13;

      // Rule (d): Also unlock automatically if user pauses tracking or no activity for 60m after 11:00 AM
      const isUnlockedByInactivityOrPause = effectivePaused || (effectiveHour >= 11 && isInactiveAfter11AM);

      const isUnlocked = isPastUnlockTime || isUnlockedByInactivityOrPause;

      // Rule (e): One submission per day; editable until midnight; afterwards show "Done today ✓" with score as "1.8 out of 5 (low)"
      const isDoneToday = summary && (summary.today_submitted || summary.submitted_at);
      const scoreText = summary ? (summary.today_score_text || `${summary.today_score || 1.8} out of 5 (${summary.today_score_desc || "low"})`) : "1.8 out of 5 (low)";

      return (
        <div
          className="ws-card p-6 border-l-4 transition-all relative"
          style={{
            borderLeftColor: isDoneToday
              ? "var(--status-steady)"
              : isUnlocked
              ? "var(--primary)"
              : "var(--border-strong)"
          }}
        >
          {/* Subtle Simulation Controls for Evaluation */}
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pb-2.5 border-b border-[var(--border-subtle)] text-[11px] text-[var(--text-muted)]">
            <span className="font-semibold uppercase tracking-wider text-[10px] text-[var(--text-secondary)]">
              Timing rule status: {isDoneToday ? "Done today ✓" : isUnlocked ? "Unlocked (>= 1:00 PM / Inactivity)" : "Locked (< 1:00 PM)"}
            </span>
            <div className="flex items-center gap-1">
              <span className="hidden sm:inline text-[10px]">Test state:</span>
              <button
                type="button"
                onClick={() => setTestOverride(testOverride === "locked" ? null : "locked")}
                className={`px-2 py-0.5 rounded text-[10px] transition-colors ${
                  testOverride === "locked"
                    ? "bg-[var(--status-strained)] text-white font-bold"
                    : "bg-[var(--bg-card-subtle)] hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)]"
                }`}
                title="Simulate 10:30 AM before shift midpoint (Locks card)"
              >
                10:30 AM (Lock)
              </button>
              <button
                type="button"
                onClick={() => setTestOverride(testOverride === "unlocked" ? null : "unlocked")}
                className={`px-2 py-0.5 rounded text-[10px] transition-colors ${
                  testOverride === "unlocked"
                    ? "bg-[var(--primary)] text-white font-bold"
                    : "bg-[var(--bg-card-subtle)] hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)]"
                }`}
                title="Simulate 2:00 PM after shift midpoint (Unlocks card)"
              >
                2:00 PM (Unlock)
              </button>
              <button
                type="button"
                onClick={() => setTestOverride(testOverride === "paused" ? null : "paused")}
                className={`px-2 py-0.5 rounded text-[10px] transition-colors ${
                  testOverride === "paused"
                    ? "bg-[var(--primary)] text-white font-bold"
                    : "bg-[var(--bg-card-subtle)] hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)]"
                }`}
                title="Simulate tracking paused (Auto-unlock)"
              >
                Tracking Paused (Unlock)
              </button>
            </div>
          </div>

          {/* Card Body by State */}
          {isDoneToday ? (
            /* (e) COMPLETED TODAY */
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold text-[var(--status-steady)] uppercase tracking-wider">
                    Day Check-in
                  </span>
                  {summary?.today_early_checkin && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-[var(--bg-card-subtle)] text-[var(--text-muted)] font-medium">
                      Early check-in
                    </span>
                  )}
                </div>
                <h3 className="text-lg sm:text-xl font-bold text-[var(--text-primary)]">
                  How was your day?
                </h3>
                <div className="flex items-center gap-2 pt-1">
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-[var(--status-steady-bg)] text-[var(--status-steady)] border border-[var(--status-steady-border)]">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                    </svg>
                    Done today &check;
                  </span>
                  <span className="text-sm font-semibold text-[var(--text-primary)]">
                    {scoreText}
                  </span>
                </div>
                <p className="text-xs text-[var(--text-secondary)] pt-0.5 leading-relaxed">
                  {summary?.submitted_at
                    ? `Recorded at ${new Date(summary.submitted_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}.`
                    : "Recorded today."}{" "}
                  Your response is editable until midnight.
                </p>
              </div>

              <div className="shrink-0">
                <button
                  type="button"
                  onClick={() => onOpenModal({ earlyCheckin: false, isEdit: true })}
                  className="ws-btn-secondary text-xs py-2 px-4 shadow-xs"
                >
                  Edit today's check-in
                </button>
              </div>
            </div>
          ) : !isUnlocked ? (
            /* (a) LOCKED BEFORE 1:00 PM */
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <span className="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">
                  Day Check-in
                </span>
                <h3 className="text-lg sm:text-xl font-bold text-[var(--text-primary)]">
                  How was your day?
                </h3>
                <div className="flex items-center gap-2 text-xs text-[var(--text-secondary)] pt-1">
                  <svg className="w-4 h-4 text-[var(--text-muted)] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  <span className="font-medium">Opens at 1:00 PM so it reflects your day.</span>
                </div>
              </div>

              {/* (b) Beside it text button: "Logging off early? Check in now." */}
              <div className="shrink-0">
                <button
                  type="button"
                  onClick={() => onOpenModal({ earlyCheckin: true, isEdit: false })}
                  className="text-xs font-semibold text-[var(--primary)] hover:underline py-2 px-3 rounded-lg hover:bg-[var(--bg-card-subtle)] transition-colors"
                >
                  Logging off early? Check in now.
                </button>
              </div>
            </div>
          ) : (
            /* (c) UNLOCKED (>= 1:00 PM OR PAUSED/INACTIVE) */
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <span className="text-xs font-semibold text-[var(--primary)] uppercase tracking-wider">
                  Day Check-in
                </span>
                <h3 className="text-lg sm:text-xl font-bold text-[var(--text-primary)]">
                  How was your day?
                </h3>
                <p className="text-xs text-[var(--text-secondary)]">
                  12 quick questions across exhaustion, mental distance, emotional balance, and focus.
                </p>
              </div>

              {/* (c) Primary button: "Take today's check-in (about 2 minutes)" */}
              <div className="shrink-0">
                <button
                  type="button"
                  onClick={() => onOpenModal({ earlyCheckin: false, isEdit: false })}
                  className="ws-btn-primary text-xs py-2.5 px-5 shadow-xs flex items-center gap-2"
                >
                  <span>Take today's check-in (about 2 minutes)</span>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // CHECK-INS PAGE (Route /check-in)
    // Score history line chart and user's usual range ("Your usual check-in score: 1.5 (low)")
    // =========================================================================
    function EmployeeCheckInPageView({ data, onOpenModal }) {
      const [hoveredPoint, setHoveredPoint] = useState(null);

      if (!data) return <Skeleton count={3} />;

      const batSummary = data.bat12_summary || {};
      const history = batSummary.checkin_history || [];
      const usualScoreText = batSummary.usual_checkin_text || "Your usual check-in score: 1.5 (low)";
      const usualVal = batSummary.usual_checkin_score || 1.5;
      const usualRange = batSummary.usual_range || { min: 1.2, max: 1.8 };

      // SVG Dimensions for Score History Chart
      const width = 740;
      const height = 180;
      const padTop = 20;
      const padBottom = 28;
      const padLeft = 32;
      const padRight = 24;
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const minScore = 1.0;
      const maxScore = 5.0;
      const rangeScore = maxScore - minScore;

      const getX = (idx) => padLeft + (idx / Math.max(1, history.length - 1)) * chartW;
      const getY = (val) => padTop + chartH - ((Math.max(minScore, Math.min(maxScore, val)) - minScore) / rangeScore) * chartH;

      // Usual Range Band Coordinates
      const bandTopY = getY(usualRange.max);
      const bandBottomY = getY(usualRange.min);
      const bandHeight = Math.max(6, bandBottomY - bandTopY);
      const usualLineY = getY(usualVal);

      // Points and Path
      const points = history.map((d, i) => ({
        x: getX(i),
        y: getY(d.score || 1.5),
        score: d.score || 1.5,
        date: d.date,
        dayName: d.day_name,
        isWeekend: d.is_weekend,
        status: d.status || "Green"
      }));

      const linePath = points.length > 0
        ? points.reduce((acc, pt, i) => `${acc} ${i === 0 ? "M" : "L"} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`, "")
        : "";

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-[var(--text-primary)]">Day Check-in</h2>
              <p className="text-xs text-[var(--text-secondary)] mt-0.5">
                Daily psychological pulse tracking personal exhaustion, mental distance, emotional regulation, and cognitive focus.
              </p>
            </div>
            <div className="flex items-center gap-1.5 text-xs text-[var(--text-muted)] bg-[var(--bg-card)] px-3 py-1.5 rounded-full border border-[var(--border-subtle)] shadow-xs self-start sm:self-auto">
              <svg className="w-3.5 h-3.5 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <span>Only you can see this page.</span>
            </div>
          </div>

          {/* Today's Check-in Card (How was your day?) */}
          <CheckInCard summary={batSummary} onOpenModal={onOpenModal} />

          {/* Score History Line Chart & User's Usual Range */}
          <div className="ws-card p-6">
            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-3">
              <div>
                <span className="text-xs font-semibold text-[var(--primary)] uppercase tracking-wider">
                  Trajectory & Baseline
                </span>
                <h3 className="text-base font-bold text-[var(--text-primary)] mt-0.5">
                  Check-in score history (past 30 days)
                </h3>
              </div>

              {/* Callout: "Your usual check-in score: 1.5 (low)" */}
              <div className="p-2.5 px-3.5 rounded-xl bg-[var(--primary-subtle)] border border-[var(--border-subtle)]">
                <span className="text-xs font-bold text-[var(--primary)]">
                  {usualScoreText}
                </span>
              </div>
            </div>

            <p className="text-xs text-[var(--text-secondary)] mb-4">
              Daily BAT-12 composite score on a 1.0 to 5.0 scale. Shaded band reflects your personal calibrated baseline.
            </p>

            {/* SVG Line Chart */}
            <div className="relative my-2">
              <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-44 overflow-visible">
                {/* Horizontal Grid lines */}
                {[1, 2, 3, 4, 5].map((s) => {
                  const y = getY(s);
                  return (
                    <g key={s}>
                      <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke="var(--border-subtle)" strokeDasharray="3 3" />
                      <text x={padLeft - 6} y={y + 3} fill="var(--text-muted)" fontSize="9" textAnchor="end">{s}.0</text>
                    </g>
                  );
                })}

                {/* Shaded "Your Usual Range" Band */}
                <rect
                  x={padLeft}
                  y={bandTopY}
                  width={chartW}
                  height={bandHeight}
                  fill="var(--primary-subtle)"
                  opacity="0.75"
                />

                {/* Dashed Center Reference Line */}
                <line
                  x1={padLeft}
                  y1={usualLineY}
                  x2={width - padRight}
                  y2={usualLineY}
                  stroke="var(--primary)"
                  strokeWidth="1.2"
                  strokeDasharray="4 4"
                />

                {/* Usual Range Text Label */}
                <text
                  x={width - padRight - 6}
                  y={bandTopY + 11}
                  fill="var(--primary)"
                  fontSize="9"
                  fontWeight="600"
                  textAnchor="end"
                >
                  Usual range ({usualRange.min} &ndash; {usualRange.max})
                </text>

                {/* Trend Line */}
                <path
                  d={linePath}
                  fill="none"
                  stroke="var(--primary)"
                  strokeWidth="2.5"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />

                {/* Data Points */}
                {points.map((pt, idx) => {
                  const meta = STATUS_META[pt.status] || STATUS_META.Green;
                  const isHovered = hoveredPoint === idx;
                  return (
                    <circle
                      key={idx}
                      cx={pt.x}
                      cy={pt.y}
                      r={isHovered ? 5.5 : 3.5}
                      fill={pt.isWeekend ? "var(--border-strong)" : meta.color}
                      stroke="var(--bg-card)"
                      strokeWidth="2"
                      className="cursor-pointer transition-all"
                      onMouseEnter={() => setHoveredPoint(idx)}
                      onMouseLeave={() => setHoveredPoint(null)}
                    />
                  );
                })}
              </svg>

              {/* Hover Tooltip */}
              {hoveredPoint !== null && points[hoveredPoint] && (
                <div
                  className="absolute bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1.5 px-3 rounded-lg shadow-lg pointer-events-none z-20 whitespace-nowrap transform -translate-x-1/2"
                  style={{
                    left: `${(points[hoveredPoint].x / width) * 100}%`,
                    top: `${(points[hoveredPoint].y / height) * 100 - 36}%`
                  }}
                >
                  <span className="font-semibold">{points[hoveredPoint].date} ({points[hoveredPoint].dayName}):</span>{" "}
                  {points[hoveredPoint].score} out of 5 &bull; {points[hoveredPoint].isWeekend ? "Weekend" : points[hoveredPoint].status}
                </div>
              )}
            </div>

            {/* X-axis date range */}
            <div className="flex justify-between text-[10px] text-[var(--text-muted)] px-1 mt-1">
              <span>{history[0]?.date || "30 days ago"}</span>
              <span>15 days ago</span>
              <span className="font-semibold text-[var(--text-secondary)]">Today</span>
            </div>
          </div>

          {/* The 4 Dimension Breakdown Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              {
                title: "Exhaustion",
                score: batSummary.today_exhaustion || 1.4,
                subtitle: "Energy & physical recovery",
                desc: "Measures feelings of total mental and physical tiredness after a day's effort."
              },
              {
                title: "Mental distance",
                score: batSummary.today_mental_distance || 1.3,
                subtitle: "Work engagement",
                desc: "Assesses psychological enthusiasm, aversion, or cynicism regarding job tasks."
              },
              {
                title: "Emotional impairment",
                score: batSummary.today_emotional || 1.3,
                subtitle: "Emotional balance",
                desc: "Reflects emotional control, mood stability, and unintentional overreactions."
              },
              {
                title: "Cognitive impairment",
                score: batSummary.today_cognitive || 1.3,
                subtitle: "Focus & concentration",
                desc: "Tracks ability to stay attentive, avoid intrusive thoughts, and avoid mistakes."
              }
            ].map((dim, i) => (
              <div key={i} className="ws-card p-4 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">{dim.title}</span>
                  <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-[var(--primary-subtle)] text-[var(--primary)]">
                    {Number(dim.score).toFixed(1)} / 5
                  </span>
                </div>
                <div className="text-sm font-bold text-[var(--text-primary)]">{dim.subtitle}</div>
                <p className="text-[11px] text-[var(--text-secondary)] leading-relaxed">{dim.desc}</p>
              </div>
            ))}
          </div>

          {/* Privacy & Clinical Grounding Card */}
          <div className="ws-card p-5 bg-[var(--bg-card-subtle)] border border-[var(--border-subtle)] text-xs text-[var(--text-secondary)] space-y-2">
            <div className="font-bold text-[var(--text-primary)]">BAT-12 Scientific Grounding & Zero-Identification</div>
            <p className="leading-relaxed">
              The Burnout Assessment Tool (BAT-12), developed by Prof. Wilmar Schaufeli and European research teams, is clinically validated to detect chronic occupational burnout. Your individual answers are strictly confidential and stored on your local workstation; managers only see anonymized, aggregate team counts.
            </p>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 4: "WHAT'S BEHIND THIS"
    // =========================================================================
    function WhatsBehindThis({ primaryDrivers = [] }) {
      const plainSentences = {
        cognitive_and_focus_fatigue: "Your focus is being broken up more often",
        work_pattern_changes: "Long stretches without a break",
        boundary_erosion: "Messages sent after work hours",
        desk_dining: "Midday meal breaks are shorter or skipped"
      };

      const fallbackDefaults = [
        "Your focus is being broken up more often",
        "Long stretches without a break",
        "Messages sent after work hours"
      ];

      const rankedDrivers = useMemo(() => {
        if (!primaryDrivers || primaryDrivers.length === 0) {
          return [
            { rank: "Biggest", text: fallbackDefaults[0] },
            { rank: "Medium", text: fallbackDefaults[1] },
            { rank: "Small", text: fallbackDefaults[2] },
          ];
        }
        const ranks = ["Biggest", "Medium", "Small"];
        return primaryDrivers.slice(0, 3).map((d, i) => ({
          rank: ranks[i] || "Small",
          text: plainSentences[d.category_key] || d.label || fallbackDefaults[i]
        }));
      }, [primaryDrivers]);

      return (
        <div className="ws-card p-6">
          <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">What's behind this</h3>
          <p className="text-xs text-[var(--text-secondary)] mb-4">
            The main behavioral shifts detected across your recent desktop activity.
          </p>

          <div className="space-y-2.5">
            {rankedDrivers.map((item, idx) => (
              <div
                key={idx}
                className="flex items-center gap-3 p-3 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card)]"
              >
                <span
                  className="px-2.5 py-1 rounded-md text-[11px] font-semibold shrink-0"
                  style={{
                    backgroundColor: idx === 0 ? "var(--status-strained-bg)" : "var(--bg-card-subtle)",
                    color: idx === 0 ? "var(--status-strained)" : "var(--text-secondary)"
                  }}
                >
                  {item.rank}
                </span>
                <span className="text-xs font-medium text-[var(--text-primary)] leading-normal">
                  {item.text}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 5: "HOW TODAY COMPARES WITH YOUR USUAL"
    // =========================================================================
    function HowTodayCompares({ deviations = {}, telemetry = [] }) {
      const todayTelemetry = telemetry[telemetry.length - 1] || {};

      const allMetrics = [
        {
          key: "work_stretch",
          value: deviations.work_stretch || 0,
          displayLabel: "Longest stretch",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.stretch_mins || 153} mins`
        },
        {
          key: "after_hours",
          value: deviations.after_hours || 0,
          displayLabel: "After-hours communication",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.after_hours_msgs || 21} msgs`
        },
        {
          key: "lunch_break",
          value: deviations.lunch_break || 0,
          displayLabel: "Lunch break duration",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.lunch_mins || 8} mins`
        },
        {
          key: "typing_speed",
          value: deviations.typing_speed || 0,
          displayLabel: "Typing pace changed",
          isAmbiguous: true,
          hoverMetric: `Today: ${todayTelemetry.wpm || 24} WPM`
        },
        {
          key: "error_rate",
          value: deviations.error_rate || 0,
          displayLabel: "Correction errors",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.backspace_ratio || 22}% corrections`
        },
        {
          key: "focus_fragmentation",
          value: deviations.focus_fragmentation || 0,
          displayLabel: "Focus fragmentation",
          isAmbiguous: false,
          hoverMetric: `Today: elevated task switching`
        }
      ];

      const top3Metrics = useMemo(() => {
        return [...allMetrics]
          .sort((a, b) => Math.abs(b.value) - Math.abs(a.value))
          .slice(0, 3);
      }, [deviations, todayTelemetry]);

      return (
        <div className="ws-card p-6">
          <div className="flex items-center justify-between mb-1">
            <h3 className="text-base font-semibold text-[var(--text-primary)]">How today compares with your usual</h3>
            <span className="text-[11px] text-[var(--text-muted)]">Top 3 shifts &bull; Hover for details</span>
          </div>
          <p className="text-xs text-[var(--text-secondary)] mb-4">
            Comparison against your 14-day calibrated personal baseline.
          </p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {top3Metrics.map((item) => (
              <DeviationBar key={item.key} item={item} />
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 6: ONE SUGGESTION TIED TO TOP CONTRIBUTOR
    // =========================================================================
    function TopContributorSuggestion({ outlookStatus = "Green", primaryDrivers = [] }) {
      const topDriver = primaryDrivers && primaryDrivers.length > 0 ? primaryDrivers[0].category_key : "work_pattern_changes";

      let suggestion = "You've had three long stretches this week. Try a 5-minute break every 90 minutes.";

      if (topDriver === "work_pattern_changes") {
        suggestion = outlookStatus === "Green"
          ? "Your session lengths are well-spaced today. Keep taking short micro-breaks between deep focus tasks."
          : "You've had three long stretches this week. Try a 5-minute break every 90 minutes.";
      } else if (topDriver === "boundary_erosion") {
        suggestion = outlookStatus === "Green"
          ? "You maintained firm evening boundaries today. Protect your restful evening."
          : "Late-night messages have increased this week. Try setting an auto-responder or closing communication apps by 7 PM.";
      } else if (topDriver === "cognitive_and_focus_fatigue") {
        suggestion = outlookStatus === "Green"
          ? "Your typing rhythm and focus blocks were steady throughout the workday."
          : "Your work focus has been broken up more often. Consider blocking a 45-minute uninterrupted quiet block tomorrow.";
      } else if (topDriver === "desk_dining") {
        suggestion = outlookStatus === "Green"
          ? "You took a proper midday meal pause today."
          : "Your lunch breaks were unusually short this week. Try taking a full 30-minute screen-free lunch away from your desk.";
      }

      return (
        <div className="ws-card p-5 border-l-4" style={{ borderLeftColor: "var(--primary)" }}>
          <div className="flex items-start gap-3">
            <div className="p-2 rounded-xl bg-[var(--primary-subtle)] text-[var(--primary)] shrink-0">

              </svg>
            </div>
            <div>

                Personalized suggestion
              </span>
              <p className="text-sm font-medium text-[var(--text-primary)] mt-0.5 leading-relaxed">
                {suggestion}
              </p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 7: 7-DAY DOT STRIP
    // =========================================================================
    function SevenDayDotStrip({ telemetry = [] }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);

      return (
        <div className="ws-card p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-semibold text-[var(--text-primary)]">Past 7 days trajectory</h3>
            <span className="text-[11px] text-[var(--text-muted)]">Weekends greyed</span>
          </div>

          <div className="grid grid-cols-7 gap-2 text-center">
            {telemetry.map((day, idx) => {
              const isToday = idx === telemetry.length - 1;
              const isWeekend = day.is_weekend;

              let dotColor = "var(--border-strong)";
              let statusLabel = "Weekend / Rest";
              let statusWord = "Off";

              if (!isWeekend) {
                const meta = STATUS_META[day.bat_status] || STATUS_META.Green;
                dotColor = meta.color;
                statusLabel = meta.word;
                statusWord = meta.word;
              }

              return (
                <div
                  key={idx}
                  className="flex flex-col items-center group relative p-1.5 rounded-xl transition-colors hover:bg-[var(--bg-card-subtle)]"
                  onMouseEnter={() => setHoveredIdx(idx)}
                  onMouseLeave={() => setHoveredIdx(null)}
                >
                  <span className="text-[11px] font-medium text-[var(--text-muted)]">{day.day_name}</span>
                  <span className="text-xs font-semibold text-[var(--text-primary)] mt-0.5">
                    {day.date.split("-")[2]}
                  </span>

                  <div className="mt-2 relative">
                    <div
                      className={`w-3.5 h-3.5 rounded-full transition-transform ${isToday ? "scale-110 ring-2 ring-offset-2 ring-[var(--primary)]" : ""}`}
                      style={{ backgroundColor: dotColor }}
                    />
                  </div>

                  <span className="text-[10px] text-[var(--text-muted)] mt-1.5 truncate max-w-full font-medium">
                    {isWeekend ? "Off" : statusWord}
                  </span>

                  {hoveredIdx === idx && (
                    <div className="absolute bottom-full mb-2 bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1.5 px-2.5 rounded-lg shadow-lg whitespace-nowrap z-30 pointer-events-none">
                      <div className="font-semibold">{day.date} ({day.day_name})</div>
                      <div>Status: {statusLabel}</div>
                      {!isWeekend && (
                        <div className="text-[10px] opacity-80 mt-0.5">
                          Stretch: {day.stretch_mins}m &bull; Late: {day.after_hours_msgs} msgs
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
