              <span className="font-semibold text-[var(--text-muted)] uppercase tracking-wider text-[10px]">
                Demo controls
              </span>
            </div>

            <div className="flex items-center gap-2 sm:gap-3">
              <div className="flex items-center bg-[var(--bg-card-subtle)] p-0.5 rounded-full border border-[var(--border-subtle)]">
                <button
                  onClick={() => {
                    setViewRole("employee");
                    setCurrentRoute("today");
                  }}
                  className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                    viewRole === "employee"
                      ? "bg-[var(--primary)] text-white shadow-xs"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}
                >
                  Employee
                </button>
                <button
                  onClick={() => {
                    setViewRole("manager");
                    setCurrentRoute("overview");
                  }}
                  className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                    viewRole === "manager"
                      ? "bg-[var(--primary)] text-white shadow-xs"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}
                >
                  Manager
                </button>
              </div>

              <div className="flex items-center bg-[var(--bg-card-subtle)] p-0.5 rounded-full border border-[var(--border-subtle)]">
                <button
                  onClick={() => setIsDemoMode(false)}
                  className={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                    !isDemoMode
                      ? "bg-[var(--status-steady)] text-white font-semibold shadow-xs"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}
                >
                  Live data
                </button>
                <button
                  onClick={() => setIsDemoMode(true)}
                  className={`px-3 py-1 rounded-full text-xs font-medium transition-all ${
                    isDemoMode
                      ? "bg-[var(--primary)] text-white font-semibold shadow-xs"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}
                >
                  Sample employees
                </button>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {viewRole === "employee" && isDemoMode && personas.length > 0 && (
                <select
                  value={selectedPersonaId}
                  onChange={(e) => setSelectedPersonaId(e.target.value)}
                  className="text-xs font-medium bg-[var(--bg-card)] border border-[var(--border-strong)] rounded-lg px-2.5 py-1 text-[var(--text-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--primary)]"
                >
                  {personas.map((p) => (
                    <option key={p.id} value={p.id}>
                      {p.title}
                    </option>
                  ))}
                </select>
              )}
            </div>
          </div>

          {/* Day Check-in Modal */}
          {showBatModal && (
            <DayCheckInModal
              responses={batResponses}
              setResponses={setBatResponses}
              onSubmit={handleBatSubmit}
              onClose={() => setShowBatModal(false)}
              submitting={submittingBat}
              success={batSubmittedSuccess}
              isEarlyCheckin={isEarlyCheckin}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // MANAGER PORTAL CONTENT (PRIVACY-PRESERVED)
    // =========================================================================
    function ManagerPortalContent({ currentRoute, setCurrentRoute, data }) {
      if (!data) return <EmptyState title="No manager telemetry" description="Unable to load team statistics." />;

      const {
        department,
        reporting_period,
        total_workforce,
        status_distribution_pct,
        status_distribution_counts,
        trajectory_30d,
        category_drivers,
      } = data;

      if (currentRoute === "about") {
        return (
          <div className="space-y-6">
            <div className="ws-card p-6">
              <span className="text-xs font-semibold text-[var(--status-steady)] uppercase tracking-wider">
                Ethical AI & Compliance Standard
              </span>
              <h2 className="text-2xl font-bold text-[var(--text-primary)] mt-1 mb-3">Privacy governance framework</h2>
              <p className="text-sm text-[var(--text-secondary)] leading-relaxed mb-4">
                WorkSense implements the Zero-Identification Protocol. Managers only receive aggregated department-level metrics to safeguard individual psychological safety.
              </p>
              <div className="p-4 rounded-xl bg-[var(--bg-card-subtle)] border border-[var(--border-subtle)] text-xs text-[var(--text-secondary)] space-y-2">
                <div>&bull; <strong className="text-[var(--text-primary)]">No individual ranking:</strong> Team members are never ranked against each other.</div>
                <div>&bull; <strong className="text-[var(--text-primary)]">No raw telemetry access:</strong> Individual keystroke logs, active application titles, and screen captures are strictly prohibited by architecture.</div>
                <div>&bull; <strong className="text-[var(--text-primary)]">Early-warning purpose:</strong> Data serves exclusively to identify organizational workload imbalance 5+ days before acute exhaustion occurs.</div>
              </div>
            </div>
          </div>
        );
      }

      if (currentRoute === "trends") {
        return (
          <div className="space-y-6">
            <div className="ws-card p-6">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <h3 className="text-base font-semibold text-[var(--text-primary)]">30-day department burnout trajectory</h3>
                  <p className="text-xs text-[var(--text-secondary)] mt-0.5">Rolling percentage of team at elevated risk</p>
                </div>
                <span className="text-xs px-2 py-0.5 rounded-md bg-[var(--bg-card-subtle)] text-[var(--text-secondary)] font-medium">
                  Aggregated telemetry
                </span>
              </div>

              <div className="h-52 flex items-end gap-1.5 pt-4 pb-1 border-b border-[var(--border-subtle)]">
                {trajectory_30d.map((pt, i) => {
                  const h = Math.max(10, (pt.pct_elevated_risk / 35.0) * 180);
                  const isHigh = pt.pct_elevated_risk > 20;
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center group relative">
                      <div
                        className="w-full rounded-t transition-all hover:opacity-85"
                        style={{ height: `${h}px`, backgroundColor: isHigh ? "var(--status-strained)" : "var(--primary)" }}
                      />
                      <div className="opacity-0 group-hover:opacity-100 transition-opacity absolute bottom-full mb-1 text-[11px] bg-[var(--text-primary)] text-[var(--bg-card)] px-2 py-1 rounded shadow-lg whitespace-nowrap z-20 pointer-events-none">
                        {pt.date}: {pt.pct_elevated_risk}%
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between text-xs text-[var(--text-muted)] mt-2">
                <span>30 days ago</span>
                <span>15 days ago</span>
                <span>Today</span>
              </div>
            </div>

            <div className="ws-card p-6">
              <h3 className="text-base font-semibold text-[var(--text-primary)] mb-4">Primary drivers across department</h3>
              <div className="space-y-4">
                {category_drivers.map((cat, i) => (
                  <div key={i}>
                    <div className="flex justify-between text-xs font-medium text-[var(--text-primary)] mb-1">
                      <span>{cat.category}</span>
                      <span className="font-bold text-[var(--primary)]">{cat.attribution_pct}%</span>
                    </div>
                    <div className="w-full h-2 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden">
                      <div
                        className="h-full rounded-full"
                        style={{ width: `${cat.attribution_pct * 2}%`, backgroundColor: "var(--primary)" }}
                      />
                    </div>
                    <div className="text-[11px] text-[var(--text-muted)] mt-1">{cat.description}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="ws-card p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span className="text-xs font-semibold text-[var(--primary)] uppercase tracking-wider">
                People analytics & organizational rhythm
              </span>
              <h2 className="text-xl font-bold text-[var(--text-primary)] mt-0.5">{department}</h2>
              <p className="text-xs text-[var(--text-secondary)] mt-0.5">
                Reporting window: {reporting_period} &bull; {total_workforce} active knowledge workers
              </p>
            </div>
            <div className="p-3 rounded-xl border border-[var(--status-steady-border)] bg-[var(--status-steady-bg)] text-xs text-[var(--status-steady)] max-w-sm">
              <strong className="block font-semibold">Zero-Identification protocol active:</strong>
              Individual names, rankings, and raw activity logs are strictly redacted.
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              {
                key: "Green",
                word: "Steady",
                color: "var(--status-steady)",
                bg: "var(--status-steady-bg)",
                border: "var(--status-steady-border)",
                icon: STATUS_META.Green.icon,
                pct: status_distribution_pct.Green,
                count: status_distribution_counts.Green,
                desc: "Within personal baseline rhythms"
              },
              {
                key: "Yellow",
                word: "Stretched",
                color: "var(--status-stretched)",
                bg: "var(--status-stretched-bg)",
                border: "var(--status-stretched-border)",
                icon: STATUS_META.Yellow.icon,
                pct: status_distribution_pct.Yellow,
                count: status_distribution_counts.Yellow,
                desc: "Minor workload rhythm variances"
              },
              {
                key: "Orange",
                word: "Strained",
                color: "var(--status-strained)",
                bg: "var(--status-strained-bg)",
                border: "var(--status-strained-border)",
                icon: STATUS_META.Orange.icon,
                pct: status_distribution_pct.Orange,
                count: status_distribution_counts.Orange,
                desc: "Flagged 5+ days before exhaustion"
              },
              {
                key: "Red",
                word: "Overloaded",
                color: "var(--status-overloaded)",
                bg: "var(--status-overloaded-bg)",
                border: "var(--status-overloaded-border)",
                icon: STATUS_META.Red.icon,
                pct: status_distribution_pct.Red,
                count: status_distribution_counts.Red,
                desc: "Severe sustained multi-factor strain"
              }
            ].map((stat, idx) => (
              <div key={idx} className="ws-card p-5" style={{ borderColor: stat.border }}>
                <div className="flex items-center justify-between mb-2">
                  <div className="ws-badge text-xs" style={{ backgroundColor: stat.bg, color: stat.color }}>
                    {stat.icon}
                    <span>{stat.word}</span>
                  </div>
                  <span className="text-xs font-medium text-[var(--text-muted)]">{stat.count} members</span>
                </div>
                <div className="text-3xl font-bold mt-1" style={{ color: stat.color }}>{stat.pct}%</div>
                <p className="text-[11px] text-[var(--text-secondary)] mt-2">{stat.desc}</p>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="ws-card p-6">
              <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">30-day burnout trajectory</h3>
              <p className="text-xs text-[var(--text-secondary)] mb-4">Rolling percentage of department at elevated risk</p>
              <div className="h-44 flex items-end gap-1.5 pt-4 pb-1 border-b border-[var(--border-subtle)]">
                {trajectory_30d.slice(-15).map((pt, i) => {
                  const h = Math.max(10, (pt.pct_elevated_risk / 35.0) * 150);
                  const isHigh = pt.pct_elevated_risk > 20;
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center">
                      <div
                        className="w-full rounded-t transition-all"
                        style={{ height: `${h}px`, backgroundColor: isHigh ? "var(--status-strained)" : "var(--primary)" }}
                      />
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between text-xs text-[var(--text-muted)] mt-2">
                <span>15 days ago</span>
                <span>Today</span>
              </div>
            </div>

            <div className="ws-card p-6">
              <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">Primary behavioral contributors</h3>
              <p className="text-xs text-[var(--text-secondary)] mb-4">Aggregated across all team members</p>
              <div className="space-y-3">
                {category_drivers.map((cat, i) => (
                  <div key={i}>
                    <div className="flex justify-between text-xs font-medium text-[var(--text-primary)] mb-1">
                      <span>{cat.category}</span>
                      <span className="font-bold text-[var(--primary)]">{cat.attribution_pct}%</span>
                    </div>
                    <div className="w-full h-2 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden">
                      <div
                        className="h-full rounded-full"
                        style={{ width: `${cat.attribution_pct * 2}%`, backgroundColor: "var(--primary)" }}
                      />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // DAY CHECK-IN MULTI-STEP MODAL (4 Groups, One Group Per Step, Skip Option)
    // =========================================================================
    function DayCheckInModal({ responses, setResponses, onSubmit, onClose, submitting, success, isEarlyCheckin }) {
      const [step, setStep] = useState(1); // 1 to 4

      const currentGroup = BAT12_GROUPS[step - 1] || BAT12_GROUPS[0];

      const handleRating = (key, val) => {
        setResponses(prev => ({ ...prev, [key]: val }));
      };

      const handleSkip = (key) => {
        setResponses(prev => ({ ...prev, [key]: null }));
      };

      const handleUnskip = (key) => {
        setResponses(prev => ({ ...prev, [key]: 2 }));
      };

      // Progress bar percentage
      const progressPct = (step / 4) * 100;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop overflow-y-auto">
          <div className="ws-card max-w-2xl w-full p-6 md:p-8 my-8 relative shadow-2xl animate-fade-in">
            {/* Close Button */}
            <button
              type="button"
              onClick={onClose}
              className="absolute top-5 right-5 text-[var(--text-muted)] hover:text-[var(--text-primary)] text-2xl font-bold p-1 leading-none"
              title="Close"
            >
              &times;
            </button>

            {/* Header */}
            <div className="mb-4">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold uppercase tracking-wider text-[var(--primary)]">
                  Day Check-in
                </span>
                {isEarlyCheckin && (
                  <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 font-semibold">
                    Logging off early
                  </span>
                )}
              </div>
              <h2 className="text-xl sm:text-2xl font-bold text-[var(--text-primary)] mt-1">
                Step {step} of 4: {currentGroup.title}
              </h2>
              <p className="text-xs text-[var(--text-secondary)] mt-0.5">
                {currentGroup.subtitle}
              </p>
            </div>

            {/* Progress Bar */}
            <div className="w-full bg-[var(--bg-card-subtle)] h-2 rounded-full overflow-hidden mb-6">
              <div
                className="h-full bg-[var(--primary)] transition-all duration-300 rounded-full"
                style={{ width: `${progressPct}%` }}
              />
            </div>

            {/* Questions for Current Step */}
            <div className="space-y-5">
              {currentGroup.questions.map((q) => {
                const currentVal = responses[q.key];
                const isSkipped = currentVal === null || currentVal === undefined;

                return (
                  <div
                    key={q.id}
                    className="p-4 rounded-2xl border border-[var(--border-subtle)] bg-[var(--bg-card)] transition-colors hover:border-[var(--border-strong)]"
                  >
                    {/* Question Header */}
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <span className="font-semibold text-sm text-[var(--text-primary)]">
                        {q.id}. {q.text}
                      </span>
                      {isSkipped && (
                        <span className="text-[11px] px-2 py-0.5 rounded-full bg-[var(--bg-card-subtle)] text-[var(--text-muted)] font-semibold shrink-0">
                          Skipped
                        </span>
                      )}
                    </div>

                    {/* 5-Point Labelled Radio Buttons with Large Tap Targets */}
                    <div className="grid grid-cols-5 gap-2">
                      {[
                        { val: 1, label: "Never" },
                        { val: 2, label: "Rarely" },
                        { val: 3, label: "Sometimes" },
                        { val: 4, label: "Often" },
                        { val: 5, label: "Always" },
                      ].map((opt) => {
                        const isSelected = !isSkipped && currentVal === opt.val;
                        return (
                          <button
                            key={opt.val}
                            type="button"
                            onClick={() => handleRating(q.key, opt.val)}
                            className={`min-h-[52px] p-2 sm:p-2.5 rounded-xl border text-center transition-all flex flex-col items-center justify-center cursor-pointer ${
                              isSelected
                                ? "bg-[var(--primary)] text-white border-[var(--primary)] font-bold shadow-xs scale-[1.02]"
                                : "bg-[var(--bg-card)] text-[var(--text-secondary)] border-[var(--border-subtle)] hover:bg-[var(--bg-card-hover)] hover:border-[var(--border-strong)]"
                            }`}
                          >
                            <span className="text-sm font-bold">{opt.val}</span>
                            <span className="text-[11px] font-medium opacity-90 truncate max-w-full">
                              {opt.label}
                            </span>
                          </button>
                        );
                      })}
                    </div>

                    {/* Skip Option on Every Item */}
                    <div className="mt-2.5 flex items-center justify-end">
                      {isSkipped ? (
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-[var(--text-muted)] italic">Question skipped</span>
                          <button
                            type="button"
                            onClick={() => handleUnskip(q.key)}
                            className="text-xs text-[var(--primary)] font-semibold hover:underline"
                          >
                            Undo
                          </button>
                        </div>
                      ) : (
                        <button
                          type="button"
                          onClick={() => handleSkip(q.key)}
                          className="text-xs text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:underline transition-colors"
                        >
                          Skip this question
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer Navigation Buttons */}
            <div className="mt-7 pt-4 border-t border-[var(--border-subtle)] flex items-center justify-between gap-3">
              <div>
                {step > 1 ? (
                  <button
                    type="button"
                    onClick={() => setStep(step - 1)}
                    className="ws-btn-secondary text-xs py-2 px-4"
                  >
                    &larr; Back
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={onClose}
                    className="ws-btn-secondary text-xs py-2 px-4"
                  >
                    Cancel
                  </button>
                )}
              </div>

              <div className="flex items-center gap-2">
                {step < 4 ? (
                  <button
                    type="button"
                    onClick={() => setStep(step + 1)}
                    className="ws-btn-primary text-xs py-2.5 px-5 flex items-center gap-2"
                  >
                    <span>Next: {BAT12_GROUPS[step].title}</span>
                    <span>&rarr;</span>
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={onSubmit}
                    disabled={submitting}
                    className="ws-btn-primary text-xs py-2.5 px-6 shadow-xs font-bold"
                  >
                    {submitting ? "Submitting..." : success ? "✓ Check-in recorded!" : "Submit check-in"}
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }
    const BAT12SurveyModal = DayCheckInModal;

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>

</html>
