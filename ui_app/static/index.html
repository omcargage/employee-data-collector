<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkSense — Early-Warning Burnout Prevention</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Design Tokens (CSS Variables: Light and Dark set) -->
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Light Theme */
      --bg-app: #F7F6F3;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #F0EFEA;
      --bg-card-hover: #FAF9F6;
      --border-subtle: #E8E6DF;
      --border-strong: #D5D2C8;
      --text-primary: #181816;
      --text-secondary: #5E5C56;
      --text-muted: #8A8880;

      --primary: #1F5C63;
      --primary-hover: #17484E;
      --primary-subtle: rgba(31, 92, 99, 0.08);
      --primary-border: rgba(31, 92, 99, 0.2);
      --primary-text: #FFFFFF;

      /* Status Colors (always paired with icon + word) */
      /* Steady = sage */
      --status-steady: #4E7A58;
      --status-steady-bg: #EDF4EF;
      --status-steady-border: #C8DEC9;

      /* Stretched = sand */
      --status-stretched: #B58934;
      --status-stretched-bg: #FBF5E8;
      --status-stretched-border: #EFE0BD;

      /* Strained = terracotta */
      --status-strained: #C45A38;
      --status-strained-bg: #FAECE6;
      --status-strained-border: #F1CBBF;

      /* Overloaded = deep rose */
      --status-overloaded: #A8384E;
      --status-overloaded-bg: #F7E8EB;
      --status-overloaded-border: #ECC1CA;

      /* Calibrating / Neutral = slate */
      --status-calibrating: #4A6572;
      --status-calibrating-bg: #EDF2F4;
      --status-calibrating-border: #CFD8DC;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 18px;
      --radius-pill: 9999px;

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card: 0 3px 14px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.05), 0 -1px 3px rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] {
      --bg-app: #151615;
      --bg-sidebar: #1C1E1C;
      --bg-card: #222422;
      --bg-card-subtle: #2B2E2B;
      --bg-card-hover: #272A27;
      --border-subtle: #2F332F;
      --border-strong: #404540;
      --text-primary: #F3F3F1;
      --text-secondary: #B1AFA7;
      --text-muted: #7E7C74;

      --primary: #3CA1AC;
      --primary-hover: #4EB4BF;
      --primary-subtle: rgba(60, 161, 172, 0.15);
      --primary-border: rgba(60, 161, 172, 0.3);
      --primary-text: #FFFFFF;

      --status-steady: #68A074;
      --status-steady-bg: rgba(78, 122, 88, 0.2);
      --status-steady-border: rgba(104, 160, 116, 0.35);

      --status-stretched: #D4A853;
      --status-stretched-bg: rgba(181, 137, 52, 0.2);
      --status-stretched-border: rgba(212, 168, 83, 0.35);

      --status-strained: #DE7755;
      --status-strained-bg: rgba(196, 90, 56, 0.2);
      --status-strained-border: rgba(222, 119, 85, 0.35);

      --status-overloaded: #C6546B;
      --status-overloaded-bg: rgba(168, 56, 78, 0.2);
      --status-overloaded-border: rgba(198, 84, 107, 0.35);

      --status-calibrating: #7C98A6;
      --status-calibrating-bg: rgba(74, 101, 114, 0.2);
      --status-calibrating-border: rgba(124, 152, 166, 0.35);

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .ws-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ws-btn-primary {
      background-color: var(--primary);
      color: var(--primary-text);
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 38px;
      text-decoration: none;
    }

    .ws-btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .ws-btn-secondary {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 38px;
      text-decoration: none;
    }

    .ws-btn-secondary:hover {
      background-color: var(--bg-card-subtle);
    }

    .ws-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .ws-skeleton {
      background: linear-gradient(90deg, var(--bg-card-subtle) 25%, var(--bg-card-hover) 50%, var(--bg-card-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 9999px;
    }
  </style>

  <!-- React 18, ReactDOM, and Babel Standalone for in-browser compilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // STATUS METADATA: ALWAYS ICON + WORD (NEVER COLOR ALONE)
    // Sage = Steady, Sand = Stretched, Terracotta = Strained, Deep Rose = Overloaded
    // =========================================================================
    const STATUS_META = {
      Green: {
        word: "Steady",
        color: "var(--status-steady)",
        bg: "var(--status-steady-bg)",
        border: "var(--status-steady-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        sentence: "Your work pattern is steady and matching your usual pace. Keep up your balanced rhythm.",
        action: "Maintain your regular lunch and stretch blocks today."
      },
      Yellow: {
        word: "Stretched",
        color: "var(--status-stretched)",
        bg: "var(--status-stretched-bg)",
        border: "var(--status-stretched-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        ),
        sentence: "Your work pattern has shifted a little from your usual. Nothing urgent, but protect your breaks this week.",
        action: "Block out a 15-minute quiet recovery window this afternoon."
      },
      Orange: {
        word: "Strained",
        color: "var(--status-strained)",
        bg: "var(--status-strained-bg)",
        border: "var(--status-strained-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        ),
        sentence: "Your work pattern shows noticeable strain building up across recent days. Prioritize recovery and protect your boundaries.",
        action: "End work at your scheduled shift time tonight with no late emails."
      },
      Red: {
        word: "Overloaded",
        color: "var(--status-overloaded)",
        bg: "var(--status-overloaded-bg)",
        border: "var(--status-overloaded-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        ),
        sentence: "Your working rhythms show sustained high fatigue and boundary erosion. Consider speaking with your team and taking restorative rest.",
        action: "Speak with your team lead about workload rebalancing and step away for an extended pause."
      },
      INSUFFICIENT_DATA: {
        word: "No status today",
        color: "var(--status-calibrating)",
        bg: "var(--status-calibrating-bg)",
        border: "var(--status-calibrating-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M20 12H4" />
          </svg>
        ),
        sentence: "No telemetry recorded today or weekend rest day. Enjoy your time away from the screen.",
        action: "Rest and recharge."
      }
    };

    // BAT-12 Short Version Questionnaire
    const BAT12_QUESTIONS = [
      { id: 1, key: "bat_q1", dim: "Exhaustion", text: "At work, I feel mentally exhausted" },
      { id: 2, key: "bat_q2", dim: "Exhaustion", text: "After a day at work, I find it hard to recover my energy" },
      { id: 3, key: "bat_q3", dim: "Exhaustion", text: "At work, I feel physically exhausted" },
      { id: 4, key: "bat_q4", dim: "Mental distance", text: "I struggle to find any enthusiasm for my work" },
      { id: 5, key: "bat_q5", dim: "Mental distance", text: "I feel a strong aversion towards my job" },
      { id: 6, key: "bat_q6", dim: "Mental distance", text: "I'm cynical about what my work means to others" },
      { id: 7, key: "bat_q7", dim: "Emotional impairment", text: "At work, I feel unable to control my emotions" },
      { id: 8, key: "bat_q8", dim: "Emotional impairment", text: "I do not recognize myself in the way I react emotionally at work" },
      { id: 9, key: "bat_q9", dim: "Emotional impairment", text: "At work I may overreact unintentionally" },
      { id: 10, key: "bat_q10", dim: "Cognitive impairment", text: "At work, I have trouble staying focused" },
      { id: 11, key: "bat_q11", dim: "Cognitive impairment", text: "When I'm working, I have trouble concentrating" },
      { id: 12, key: "bat_q12", dim: "Cognitive impairment", text: "I make mistakes in my work because I have my mind on other things" }
    ];

    // =========================================================================
    // REUSABLE COMPONENT: Skeleton
    // =========================================================================
    function Skeleton({ type = "card", count = 1, className = "" }) {
      if (type === "text") {
        return (
          <div className={`space-y-2.5 ${className}`}>
            {Array.from({ length: count }).map((_, i) => (
              <div key={i} className="h-4 ws-skeleton" style={{ width: i === 0 ? "80%" : "60%" }} />
            ))}
          </div>
        );
      }
      return (
        <div className={`space-y-4 ${className}`}>
          {Array.from({ length: count }).map((_, i) => (
            <div key={i} className="ws-card p-6 space-y-3">
              <div className="h-5 w-48 ws-skeleton" />
              <div className="h-4 w-full ws-skeleton" />
              <div className="h-4 w-3/4 ws-skeleton" />
            </div>
          ))}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: EmptyState
    // =========================================================================
    function EmptyState({ icon, title, description, actionText, onAction }) {
      return (
        <div className="ws-card p-10 text-center flex flex-col items-center justify-center">
          <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-4" style={{ backgroundColor: "var(--primary-subtle)", color: "var(--primary)" }}>
            {icon || (
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            )}
          </div>
          <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">{title}</h3>
          <p className="text-sm text-[var(--text-secondary)] max-w-md mb-5 leading-relaxed">{description}</p>
          {actionText && onAction && (
            <button onClick={onAction} className="ws-btn-primary">
              {actionText}
            </button>
          )}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: DeviationBar
    // Center = "Your usual", Bands: Typical / A bit different / Much different
    // Shows "changed" instead of "worse" for ambiguous metrics (typing speed).
    // Exact numbers on hover.
    // =========================================================================
    function DeviationBar({ item }) {
      const [hovered, setHovered] = useState(false);
      const val = item.value || 0;
      const absVal = Math.abs(val);

      // Determine Band
      // Typical: absVal < 1.2
      // A bit different: 1.2 <= absVal < 2.5
      // Much different: absVal >= 2.5
      let bandLabel = "Typical";
      let bandColor = "var(--text-secondary)";
      let bandBg = "var(--bg-card-subtle)";
      let barColor = "var(--border-strong)";

      if (absVal >= 2.5) {
        bandLabel = "Much different";
        bandColor = "var(--status-overloaded)";
        bandBg = "var(--status-overloaded-bg)";
        barColor = "var(--status-overloaded)";
      } else if (absVal >= 1.2) {
        bandLabel = "A bit different";
        bandColor = "var(--status-stretched)";
        bandBg = "var(--status-stretched-bg)";
        barColor = "var(--status-stretched)";
      }

      // Percentage for the bar: offset from center (0 to 50%)
      const clampedPct = Math.min(48, (absVal / 5.0) * 48);

      return (
        <div
          className="p-3.5 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card)] relative transition-all hover:border-[var(--border-strong)]"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div className="flex items-center justify-between text-xs mb-1.5">
            <span className="font-semibold text-[var(--text-primary)]">{item.displayLabel}</span>
            <span
              className="px-2 py-0.5 rounded-full text-[11px] font-medium"
              style={{ backgroundColor: bandBg, color: bandColor }}
            >
              {bandLabel}
            </span>
          </div>

          {/* Divergent Visual Bar: Left = Negative, Center = 50% (Your usual), Right = Positive */}
          <div className="relative h-2.5 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden my-2">
            {/* Center Line Marker (Your usual) */}
            <div className="absolute top-0 bottom-0 left-1/2 w-0.5 bg-[var(--text-muted)] z-10" />

            {/* Filled Deviation Segment */}
            {val < 0 ? (
              <div
                className="absolute top-0 bottom-0 rounded-l-full transition-all duration-300"
                style={{
                  right: "50%",
                  width: `${clampedPct}%`,
                  backgroundColor: barColor
                }}
              />
            ) : (
              <div
                className="absolute top-0 bottom-0 rounded-r-full transition-all duration-300"
                style={{
                  left: "50%",
                  width: `${clampedPct}%`,
                  backgroundColor: barColor
                }}
              />
            )}
          </div>

          {/* Footnote Labels: Centre = Your usual */}
          <div className="flex justify-between items-center text-[10px] text-[var(--text-muted)]">
            <span>Lower</span>
            <span className="font-semibold text-[var(--text-secondary)]">Your usual</span>
            <span>Higher</span>
          </div>

          {/* Exact numbers on hover tooltip */}
          {hovered && (
            <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1 px-2.5 rounded-lg shadow-lg whitespace-nowrap z-30 pointer-events-none">
              <span className="font-semibold">{item.hoverMetric}</span> &bull; {val > 0 ? `+${val}` : val} MAD from usual
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: MetricChart
    // =========================================================================
    function MetricChart({ title, subtitle, items = [], dataKey = "stretch_mins", labelKey = "day_name", unit = "mins", maxReference = 180 }) {
      const [hoveredIndex, setHoveredIndex] = useState(null);

      return (
        <div className="ws-card p-6">
          <div className="flex items-start justify-between gap-4 mb-4">
            <div>
              <h3 className="text-base font-semibold text-[var(--text-primary)]">{title}</h3>
              {subtitle && <p className="text-xs text-[var(--text-secondary)] mt-0.5">{subtitle}</p>}
            </div>
            <span className="text-xs font-medium px-2 py-0.5 rounded-md bg-[var(--bg-card-subtle)] text-[var(--text-secondary)]">
              7-day telemetry
            </span>
          </div>

          <div className="h-44 flex items-end gap-2 pt-4 pb-1 border-b border-[var(--border-subtle)]">
            {items.map((item, idx) => {
              const val = item[dataKey] || 0;
              const heightPct = Math.min(100, Math.max(12, (val / maxReference) * 100));
              const isAlert = val > maxReference * 0.75;
              const isSelected = hoveredIndex === idx;

              return (
                <div
                  key={idx}
                  onMouseEnter={() => setHoveredIndex(idx)}
                  onMouseLeave={() => setHoveredIndex(null)}
                  className="flex-1 flex flex-col items-center group relative cursor-pointer"
                >
                  <div
                    className="w-full rounded-t-lg transition-all duration-200"
                    style={{
                      height: `${heightPct}%`,
                      backgroundColor: isAlert ? "var(--status-strained)" : "var(--primary)",
                      opacity: hoveredIndex !== null && !isSelected ? 0.45 : 1
                    }}
                  />
                  {isSelected && (
                    <div className="absolute bottom-full mb-2 bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1 px-2 rounded-lg shadow-lg whitespace-nowrap z-20 pointer-events-none">
                      <div className="font-semibold">{item.date} ({item[labelKey]})</div>
                      <div>{val} {unit}</div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="flex justify-between text-xs text-[var(--text-muted)] mt-2">
            {items.map((item, idx) => (
              <span key={idx} className="flex-1 text-center font-medium">
                {item[labelKey] || item.date}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: NudgeCard
    // =========================================================================
    function NudgeCard({ nudge }) {
      return (
        <div className="p-3.5 rounded-xl border border-[var(--primary-border)] bg-[var(--primary-subtle)] flex items-start gap-3">
          <div className="p-1.5 rounded-lg bg-[var(--bg-card)] shrink-0 shadow-xs text-[var(--primary)]">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <h4 className="text-xs font-semibold text-[var(--text-primary)]">{nudge.title}</h4>
            <p className="text-xs text-[var(--text-secondary)] mt-0.5 leading-relaxed">{nudge.message}</p>
          </div>
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: CheckInCard
    // Section 3: Prominent Day Check-in card
    // =========================================================================
    function CheckInCard({ summary, onOpenModal }) {
      const isCompleted = summary && summary.verified_stress_day !== undefined;
      const todayStatus = summary ? summary.today_status : "Steady";
      const meta = STATUS_META[todayStatus] || STATUS_META.Green;

      return (
        <div className="ws-card p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div className="flex items-start gap-3.5">
            <div
              className="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0"
              style={{ backgroundColor: "var(--primary-subtle)", color: "var(--primary)" }}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div>
              <div className="flex items-center gap-2">
                <h3 className="text-base font-semibold text-[var(--text-primary)]">Day check-in</h3>
                {isCompleted && (
                  <span className="ws-badge text-xs" style={{ backgroundColor: meta.bg, color: meta.color, borderColor: meta.border }}>
                    {meta.icon}
                    <span>Completed &bull; {meta.word}</span>
                  </span>
                )}
              </div>
              <p className="text-xs text-[var(--text-secondary)] mt-0.5 leading-relaxed">
                {isCompleted
                  ? `Today's check-in recorded (${summary.today_score}/5.0). Exhaustion: ${summary.today_exhaustion}, Focus: ${summary.today_cognitive}.`
                  : "Under 45 seconds. Rate your cognitive focus and energy to help calibrate your baseline."}
              </p>
            </div>
          </div>

          <button onClick={onOpenModal} className="ws-btn-primary shrink-0">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
            <span>{isCompleted ? "Update check-in" : "Start check-in"}</span>
          </button>
        </div>
      );
    }

    // =========================================================================
    // SECTION 7: 7-DAY DOT STRIP (Status Colours, Weekends Greyed)
    // =========================================================================
    function SevenDayDotStrip({ telemetry = [] }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);

      return (
        <div className="ws-card p-5">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-semibold text-[var(--text-primary)]">Past 7 days trajectory</h3>
            <span className="text-[11px] text-[var(--text-muted)]">Weekends greyed</span>
          </div>

          <div className="grid grid-cols-7 gap-2 text-center">
            {telemetry.map((day, idx) => {
              const isToday = idx === telemetry.length - 1;
              const isWeekend = day.is_weekend;

              // Color based on status, or grey if weekend
              let dotColor = "var(--border-strong)";
              let statusLabel = "Weekend / Rest";
              let statusWord = "Off";

              if (!isWeekend) {
                const meta = STATUS_META[day.bat_status] || STATUS_META.Green;
                dotColor = meta.color;
                statusLabel = meta.word;
                statusWord = meta.word;
              }

              return (
                <div
                  key={idx}
                  className="flex flex-col items-center group relative p-1.5 rounded-xl transition-colors hover:bg-[var(--bg-card-subtle)]"
                  onMouseEnter={() => setHoveredIdx(idx)}
                  onMouseLeave={() => setHoveredIdx(null)}
                >
                  <span className="text-[11px] font-medium text-[var(--text-muted)]">{day.day_name}</span>
                  <span className="text-xs font-semibold text-[var(--text-primary)] mt-0.5">
                    {day.date.split("-")[2]}
                  </span>

                  {/* Dot */}
                  <div className="mt-2 relative">
                    <div
                      className={`w-3.5 h-3.5 rounded-full transition-transform ${isToday ? "scale-110 ring-2 ring-offset-2 ring-[var(--primary)]" : ""}`}
                      style={{ backgroundColor: dotColor }}
                    />
                  </div>

                  <span className="text-[10px] text-[var(--text-muted)] mt-1.5 truncate max-w-full font-medium">
                    {isWeekend ? "Off" : statusWord}
                  </span>

                  {/* Tooltip on hover */}
                  {hoveredIdx === idx && (
                    <div className="absolute bottom-full mb-2 bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1.5 px-2.5 rounded-lg shadow-lg whitespace-nowrap z-30 pointer-events-none">
                      <div className="font-semibold">{day.date} ({day.day_name})</div>
                      <div>Status: {statusLabel}</div>
                      {!isWeekend && (
                        <div className="text-[10px] opacity-80 mt-0.5">
                          Stretch: {day.stretch_mins}m &bull; Late: {day.after_hours_msgs} msgs
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 2: OUTLOOK CARD (Or Calibration Card for Days 1–14)
    // =========================================================================
    function OutlookOrCalibrationCard({ data }) {
      const [howExpanded, setHowExpanded] = useState(false);

      const {
        predicted_status_5d,
        confidence = 0.9,
        risk_score = 0.2,
        calibration_progress,
        is_calibrated = true
      } = data;

      const daysCollected = calibration_progress ? calibration_progress.days_collected : 14;
      const daysRequired = calibration_progress ? calibration_progress.days_required : 14;
      const isCalibrationMode = !calibration_progress.is_calibrated || daysCollected < 14;

      // CASE A: DAYS 1–14 CALIBRATION CARD (Replaces Outlook card completely)
      if (isCalibrationMode) {
        const pct = calibration_progress.progress_pct || Math.round((daysCollected / daysRequired) * 100);
        const radius = 38;
        const circumference = 2 * Math.PI * radius;
        const strokeDashoffset = circumference - (pct / 100) * circumference;

        return (
          <div className="ws-card p-6 border-l-4" style={{ borderLeftColor: "var(--status-calibrating)" }}>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
              <div className="space-y-2">
                <span className="text-xs font-semibold text-[var(--status-calibrating)] uppercase tracking-wider">
                  Baseline learning phase
                </span>
                <h2 className="text-xl font-bold text-[var(--text-primary)]">
                  Learning your normal: day {daysCollected} of {daysRequired}
                </h2>
                <p className="text-sm text-[var(--text-secondary)] max-w-xl leading-relaxed">
                  WorkSense is observing your desktop habits across typing pace, continuous focus stretches, and breaks to establish your personal baseline. No burnout status is generated during this 14-day calibration window.
                </p>
                <div className="text-xs text-[var(--text-muted)] pt-1">
                  Daily check-ins completed: <strong className="text-[var(--text-primary)]">{calibration_progress.bat12_completed || daysCollected} of {daysCollected}</strong>
                </div>
              </div>

              {/* Progress Ring */}
              <div className="relative shrink-0 flex items-center justify-center">
                <svg className="w-24 h-24 transform -rotate-90" viewBox="0 0 100 100">
                  <circle
                    cx="50"
                    cy="50"
                    r={radius}
                    stroke="var(--bg-card-subtle)"
                    strokeWidth="8"
                    fill="transparent"
                  />
                  <circle
                    cx="50"
                    cy="50"
                    r={radius}
                    stroke="var(--status-calibrating)"
                    strokeWidth="8"
                    strokeDasharray={circumference}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    fill="transparent"
                    style={{ transition: "stroke-dashoffset 0.5s ease" }}
                  />
                </svg>
                <div className="absolute text-center">
                  <div className="text-base font-bold text-[var(--text-primary)]">Day {daysCollected}</div>
                  <div className="text-[10px] text-[var(--text-muted)]">of {daysRequired}</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // CASE B: OUTLOOK CARD (For Calibrated Employees)
      const meta = STATUS_META[predicted_status_5d] || STATUS_META.Green;

      // Confidence label: High (>= 0.85), Medium (>= 0.70), Low (< 0.70)
      const confidenceLabel = confidence >= 0.85 ? "High" : confidence >= 0.70 ? "Medium" : "Low";
      const riskFormatted = risk_score ? (risk_score * 10).toFixed(1) : "1.8";

      return (
        <div className="ws-card p-6">
          <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-4">
            <div>
              <h2 className="text-xl font-bold text-[var(--text-primary)]">Your next 5 working days</h2>
            </div>
            {/* Status Chip (Steady / Stretched / Strained / Overloaded with icon) */}
            <div
              className="ws-badge text-sm shrink-0"
              style={{ backgroundColor: meta.bg, color: meta.color, borderColor: meta.border }}
            >
              {meta.icon}
              <span>{meta.word}</span>
            </div>
          </div>

          {/* One plain sentence */}
          <p className="text-sm text-[var(--text-primary)] leading-relaxed font-medium mb-3">
            {meta.sentence}
          </p>

          {/* One suggested action */}
          <div className="p-3.5 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card-subtle)] text-xs text-[var(--text-secondary)] mb-4">
            <strong className="text-[var(--text-primary)]">Suggested action:</strong> {meta.action}
          </div>

          {/* "How is this worked out?" Expander */}
          <div className="pt-2 border-t border-[var(--border-subtle)]">
            <button
              onClick={() => setHowExpanded(!howExpanded)}
              className="text-xs font-semibold text-[var(--primary)] hover:underline flex items-center gap-1.5 focus:outline-none"
            >
              <span>How is this worked out?</span>
              <svg
                className={`w-3.5 h-3.5 transform transition-transform ${howExpanded ? "rotate-180" : ""}`}
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            {howExpanded && (
              <div className="mt-3 p-3.5 rounded-xl bg-[var(--bg-card-subtle)] border border-[var(--border-subtle)] text-xs space-y-2 text-[var(--text-secondary)]">
                <div className="flex items-center justify-between">
                  <span>Model confidence:</span>
                  <strong className="text-[var(--text-primary)]">{confidenceLabel} ({(confidence * 100).toFixed(0)}%)</strong>
                </div>
                <div className="flex items-center justify-between">
                  <span>Burnout risk index:</span>
                  <strong className="text-[var(--text-primary)]">{riskFormatted} / 10</strong>
                </div>
                <p className="text-[11px] text-[var(--text-muted)] pt-1 border-t border-[var(--border-subtle)] leading-relaxed">
                  Based on deviations from your personal 14-day baseline across typing rhythm, session stretch lengths, and after-hours communication.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 4: "WHAT'S BEHIND THIS" (Ranked Biggest/Medium/Small, No Percentages)
    // =========================================================================
    function WhatsBehindThis({ primaryDrivers = [] }) {
      // Map categories to plain sentences
      const plainSentences = {
        cognitive_and_focus_fatigue: "Your focus is being broken up more often",
        work_pattern_changes: "Long stretches without a break",
        boundary_erosion: "Messages sent after work hours",
        desk_dining: "Midday meal breaks are shorter or skipped"
      };

      const fallbackDefaults = [
        "Your focus is being broken up more often",
        "Long stretches without a break",
        "Messages sent after work hours"
      ];

      // Format top 3 drivers with plain sentences and ranks
      const rankedDrivers = useMemo(() => {
        if (!primaryDrivers || primaryDrivers.length === 0) {
          return [
            { rank: "Biggest", text: fallbackDefaults[0] },
            { rank: "Medium", text: fallbackDefaults[1] },
            { rank: "Small", text: fallbackDefaults[2] },
          ];
        }
        const ranks = ["Biggest", "Medium", "Small"];
        return primaryDrivers.slice(0, 3).map((d, i) => ({
          rank: ranks[i] || "Small",
          text: plainSentences[d.category_key] || d.label || fallbackDefaults[i]
        }));
      }, [primaryDrivers]);

      return (
        <div className="ws-card p-6">
          <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">What's behind this</h3>
          <p className="text-xs text-[var(--text-secondary)] mb-4">
            The main behavioral shifts detected across your recent desktop activity.
          </p>

          <div className="space-y-2.5">
            {rankedDrivers.map((item, idx) => (
              <div
                key={idx}
                className="flex items-center gap-3 p-3 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card)]"
              >
                <span
                  className="px-2.5 py-1 rounded-md text-[11px] font-semibold shrink-0"
                  style={{
                    backgroundColor: idx === 0 ? "var(--status-strained-bg)" : "var(--bg-card-subtle)",
                    color: idx === 0 ? "var(--status-strained)" : "var(--text-secondary)"
                  }}
                >
                  {item.rank}
                </span>
                <span className="text-xs font-medium text-[var(--text-primary)] leading-normal">
                  {item.text}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 5: "HOW TODAY COMPARES WITH YOUR USUAL"
    // Top 3 deviating metrics as DeviationBars.
    // "changed" instead of "worse" for ambiguous metrics (typing speed).
    // Exact numbers on hover.
    // =========================================================================
    function HowTodayCompares({ deviations = {}, telemetry = [] }) {
      const todayTelemetry = telemetry[telemetry.length - 1] || {};

      // All 6 candidate metrics with metadata
      const allMetrics = [
        {
          key: "work_stretch",
          value: deviations.work_stretch || 0,
          displayLabel: "Longest stretch",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.stretch_mins || 153} mins`
        },
        {
          key: "after_hours",
          value: deviations.after_hours || 0,
          displayLabel: "After-hours communication",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.after_hours_msgs || 21} msgs`
        },
        {
          key: "lunch_break",
          value: deviations.lunch_break || 0,
          displayLabel: "Lunch break duration",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.lunch_mins || 8} mins`
        },
        {
          key: "typing_speed",
          value: deviations.typing_speed || 0,
          displayLabel: "Typing pace changed", // Show "changed" instead of "worse"
          isAmbiguous: true,
          hoverMetric: `Today: ${todayTelemetry.wpm || 24} WPM`
        },
        {
          key: "error_rate",
          value: deviations.error_rate || 0,
          displayLabel: "Correction errors",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.backspace_ratio || 22}% corrections`
        },
        {
          key: "focus_fragmentation",
          value: deviations.focus_fragmentation || 0,
          displayLabel: "Focus fragmentation",
          isAmbiguous: false,
          hoverMetric: `Today: elevated task switching`
        }
      ];

      // Sort by absolute deviation and take ONLY TOP 3
      const top3Metrics = useMemo(() => {
        return [...allMetrics]
          .sort((a, b) => Math.abs(b.value) - Math.abs(a.value))
          .slice(0, 3);
      }, [deviations, todayTelemetry]);

      return (
        <div className="ws-card p-6">
          <div className="flex items-center justify-between mb-1">
            <h3 className="text-base font-semibold text-[var(--text-primary)]">How today compares with your usual</h3>
            <span className="text-[11px] text-[var(--text-muted)]">Top 3 shifts &bull; Hover for details</span>
          </div>
          <p className="text-xs text-[var(--text-secondary)] mb-4">
            Comparison against your 14-day calibrated personal baseline.
          </p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {top3Metrics.map((item) => (
              <DeviationBar key={item.key} item={item} />
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 6: ONE SUGGESTION TIED TO TOP CONTRIBUTOR
    // Never contradicts Outlook status.
    // =========================================================================
    function TopContributorSuggestion({ outlookStatus = "Green", primaryDrivers = [] }) {
      const topDriver = primaryDrivers && primaryDrivers.length > 0 ? primaryDrivers[0].category_key : "work_pattern_changes";

      let suggestion = "You've had three long stretches this week. Try a 5-minute break every 90 minutes.";

      if (topDriver === "work_pattern_changes") {
        suggestion = outlookStatus === "Green"
          ? "Your session lengths are well-spaced today. Keep taking short micro-breaks between deep focus tasks."
          : "You've had three long stretches this week. Try a 5-minute break every 90 minutes.";
      } else if (topDriver === "boundary_erosion") {
        suggestion = outlookStatus === "Green"
          ? "You maintained firm evening boundaries today. Protect your restful evening."
          : "Late-night messages have increased this week. Try setting an auto-responder or closing communication apps by 7 PM.";
      } else if (topDriver === "cognitive_and_focus_fatigue") {
        suggestion = outlookStatus === "Green"
          ? "Your typing rhythm and focus blocks were steady throughout the workday."
          : "Your work focus has been broken up more often. Consider blocking a 45-minute uninterrupted quiet block tomorrow.";
      } else if (topDriver === "desk_dining") {
        suggestion = outlookStatus === "Green"
          ? "You took a proper midday meal pause today."
          : "Your lunch breaks were unusually short this week. Try taking a full 30-minute screen-free lunch away from your desk.";
      }

      return (
        <div className="ws-card p-5 border-l-4" style={{ borderLeftColor: "var(--primary)" }}>
          <div className="flex items-start gap-3">
            <div className="p-2 rounded-xl bg-[var(--primary-subtle)] text-[var(--primary)] shrink-0">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
            <div>
              <span className="text-[11px] font-semibold text-[var(--primary)] uppercase tracking-wider">
                Personalized suggestion
              </span>
              <p className="text-sm font-medium text-[var(--text-primary)] mt-0.5 leading-relaxed">
                {suggestion}
              </p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EMPLOYEE: "TODAY" PAGE (Route /today)
    // Ordered strictly: (1) Greeting, (2) Outlook/Calibration, (3) Check-in,
    // (4) What's behind this, (5) How today compares, (6) Suggestion, (7) 7-day dot strip
    // =========================================================================
    function EmployeeTodayView({ data, onOpenBatModal, isDemoMode }) {
      if (!data) return <Skeleton count={3} />;

      const {
        name,
        current_date,
        predicted_status_5d,
        primary_drivers,
        relative_deviations,
        recent_7d_telemetry,
        bat12_summary,
      } = data;

      // Extract First Name for Greeting
      const firstName = name ? name.split(" ")[0] : "there";

      // Time of day greeting
      const currentHour = new Date().getHours();
      let greetingPrefix = "Good evening";
      if (currentHour < 12) greetingPrefix = "Good morning";
      else if (currentHour < 17) greetingPrefix = "Good afternoon";

      // Format Date nicely: e.g. "Saturday, 14 Nov"
      const formattedDate = useMemo(() => {
        if (!current_date) return "Saturday, 14 Nov";
        try {
          const d = new Date(current_date + "T00:00:00");
          return d.toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "short" });
        } catch {
          return current_date;
        }
      }, [current_date]);

      return (
        <div className="space-y-6">
          {/* SECTION 1: GREETING & PERSISTENT LOCK LINE */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2.5">
                <h1 className="text-2xl sm:text-3xl font-bold text-[var(--text-primary)]">
                  {greetingPrefix}, {firstName}
                </h1>
                {/* Small green "Live data" dot (or teal for Sample employees) */}
                <div className="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[var(--bg-card)] border border-[var(--border-subtle)] text-xs font-medium shadow-xs">
                  <span
                    className="w-2 h-2 rounded-full"
                    style={{ backgroundColor: !isDemoMode ? "var(--status-steady)" : "var(--primary)" }}
                  />
                  <span className="text-[11px] text-[var(--text-secondary)]">
                    {!isDemoMode ? "Live data" : "Sample data"}
                  </span>
                </div>
              </div>
              <p className="text-xs text-[var(--text-muted)] mt-1 font-medium">
                {formattedDate}
              </p>
            </div>

            {/* Persistent Lock Line */}
            <div className="flex items-center gap-1.5 text-xs text-[var(--text-muted)] bg-[var(--bg-card)] px-3 py-1.5 rounded-full border border-[var(--border-subtle)] shadow-xs shrink-0 self-start sm:self-auto">
              <svg className="w-3.5 h-3.5 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <span>Only you can see this page.</span>
            </div>
          </div>

          {/* SECTION 2: OUTLOOK CARD (Or Calibration Card for Days 1–14) */}
          <OutlookOrCalibrationCard data={data} />

          {/* SECTION 3: DAY CHECK-IN CARD */}
          <CheckInCard summary={bat12_summary} onOpenModal={onOpenBatModal} />

          {/* SECTION 4: WHAT'S BEHIND THIS (Ranked Biggest/Medium/Small, No Percentages) */}
          <WhatsBehindThis primaryDrivers={primary_drivers} />

          {/* SECTION 5: HOW TODAY COMPARES WITH YOUR USUAL (Top 3 DeviationBars) */}
          <HowTodayCompares deviations={relative_deviations} telemetry={recent_7d_telemetry} />

          {/* SECTION 6: ONE SUGGESTION TIED TO TOP CONTRIBUTOR */}
          <TopContributorSuggestion outlookStatus={predicted_status_5d} primaryDrivers={primary_drivers} />

          {/* SECTION 7: 7-DAY DOT STRIP (Status Colours, Weekends Greyed) */}
          <SevenDayDotStrip telemetry={recent_7d_telemetry} />
        </div>
      );
    }

    // =========================================================================
    // MAIN APPLICATION CONTAINER & SHELL
    // =========================================================================
    function App() {
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [currentTheme, setCurrentTheme] = useState("light");
      const [currentRoute, setCurrentRoute] = useState("today"); // Default route: /today

      // Role & Data States
      const [viewRole, setViewRole] = useState("employee"); // "employee" or "manager"
      const [isDemoMode, setIsDemoMode] = useState(true); // true = "Sample employees", false = "Live data"
      const [personas, setPersonas] = useState([]);
      const [selectedPersonaId, setSelectedPersonaId] = useState("EMP_089");
      const [employeeData, setEmployeeData] = useState(null);
      const [managerData, setManagerData] = useState(null);
      const [loading, setLoading] = useState(true);

      // Modal State for BAT-12
      const [showBatModal, setShowBatModal] = useState(false);
      const [batResponses, setBatResponses] = useState({});
      const [submittingBat, setSubmittingBat] = useState(false);
      const [batSubmittedSuccess, setBatSubmittedSuccess] = useState(false);

      const toggleTheme = () => {
        const nextTheme = currentTheme === "light" ? "dark" : "light";
        setCurrentTheme(nextTheme);
        document.documentElement.setAttribute("data-theme", nextTheme);
      };

      useEffect(() => {
        fetch("/api/demo/personas")
          .then(res => res.json())
          .then(data => setPersonas(data))
          .catch(err => console.error("Error loading personas:", err));
      }, []);

      const loadEmployeeData = (empId, mode) => {
        setLoading(true);
        const persona = personas.find(p => p.id === empId);
        const cutoff = persona ? persona.cutoff_day : null;
        const cutoffParam = cutoff ? `&day_cutoff=${cutoff}` : "";

        fetch(`/api/employee/dashboard?employee_id=${empId}&mode=${mode}${cutoffParam}`)
          .then(res => res.json())
          .then(data => {
            setEmployeeData(data);
            setLoading(false);
          })
          .catch(err => {
            console.error("Error loading employee telemetry:", err);
            setLoading(false);
          });
      };

      const loadManagerData = () => {
        setLoading(true);
        fetch("/api/manager/overview")
          .then(res => res.json())
          .then(data => {
            setManagerData(data);
            setLoading(false);
          })
          .catch(err => {
            console.error("Error loading manager data:", err);
            setLoading(false);
          });
      };

      useEffect(() => {
        if (viewRole === "employee") {
          loadEmployeeData(selectedPersonaId, isDemoMode ? "demo" : "live");
        } else {
          loadManagerData();
        }
      }, [viewRole, selectedPersonaId, isDemoMode]);

      useEffect(() => {
        const initial = {};
        BAT12_QUESTIONS.forEach(q => {
          initial[q.key] = 2;
        });
        setBatResponses(initial);
      }, [showBatModal]);

      const handleBatSubmit = () => {
        setSubmittingBat(true);
        fetch("/api/employee/survey/bat12", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            employee_id: selectedPersonaId,
            logical_day: employeeData ? employeeData.current_date : null,
            items: batResponses
          })
        })
          .then(res => res.json())
          .then(() => {
            setSubmittingBat(false);
            setBatSubmittedSuccess(true);

                <div>&bull; <strong className="text-[var(--text-primary)]">No individual ranking:</strong> Team members are never ranked against each other.</div>
                <div>&bull; <strong className="text-[var(--text-primary)]">No raw telemetry access:</strong> Individual keystroke logs, active application titles, and screen captures are strictly prohibited by architecture.</div>
                <div>&bull; <strong className="text-[var(--text-primary)]">Early-warning purpose:</strong> Data serves exclusively to identify organizational workload imbalance 5+ days before acute exhaustion occurs.</div>
              </div>
            </div>
          </div>
        );
      }

      if (currentRoute === "trends") {
        return (
          <div className="space-y-6">
            <div className="ws-card p-6">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <h3 className="text-base font-semibold text-[var(--text-primary)]">30-day department burnout trajectory</h3>
                  <p className="text-xs text-[var(--text-secondary)] mt-0.5">Rolling percentage of team at elevated risk</p>
                </div>
                <span className="text-xs px-2 py-0.5 rounded-md bg-[var(--bg-card-subtle)] text-[var(--text-secondary)] font-medium">
                  Aggregated telemetry
                </span>
              </div>

              <div className="h-52 flex items-end gap-1.5 pt-4 pb-1 border-b border-[var(--border-subtle)]">
                {trajectory_30d.map((pt, i) => {
                  const h = Math.max(10, (pt.pct_elevated_risk / 35.0) * 180);
                  const isHigh = pt.pct_elevated_risk > 20;
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center group relative">
                      <div
                        className="w-full rounded-t transition-all hover:opacity-85"
                        style={{ height: `${h}px`, backgroundColor: isHigh ? "var(--status-strained)" : "var(--primary)" }}
                      />
                      <div className="opacity-0 group-hover:opacity-100 transition-opacity absolute bottom-full mb-1 text-[11px] bg-[var(--text-primary)] text-[var(--bg-card)] px-2 py-1 rounded shadow-lg whitespace-nowrap z-20 pointer-events-none">
                        {pt.date}: {pt.pct_elevated_risk}%
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between text-xs text-[var(--text-muted)] mt-2">
                <span>30 days ago</span>
                <span>15 days ago</span>
                <span>Today</span>
              </div>
            </div>

            <div className="ws-card p-6">
              <h3 className="text-base font-semibold text-[var(--text-primary)] mb-4">Primary drivers across department</h3>
              <div className="space-y-4">
                {category_drivers.map((cat, i) => (
                  <div key={i}>
                    <div className="flex justify-between text-xs font-medium text-[var(--text-primary)] mb-1">
                      <span>{cat.category}</span>
                      <span className="font-bold text-[var(--primary)]">{cat.attribution_pct}%</span>
                    </div>
                    <div className="w-full h-2 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden">
                      <div
                        className="h-full rounded-full"
                        style={{ width: `${cat.attribution_pct * 2}%`, backgroundColor: "var(--primary)" }}
                      />
                    </div>
                    <div className="text-[11px] text-[var(--text-muted)] mt-1">{cat.description}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="ws-card p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span className="text-xs font-semibold text-[var(--primary)] uppercase tracking-wider">
                People analytics & organizational rhythm
              </span>
              <h2 className="text-xl font-bold text-[var(--text-primary)] mt-0.5">{department}</h2>
              <p className="text-xs text-[var(--text-secondary)] mt-0.5">
                Reporting window: {reporting_period} &bull; {total_workforce} active knowledge workers
              </p>
            </div>
            <div className="p-3 rounded-xl border border-[var(--status-steady-border)] bg-[var(--status-steady-bg)] text-xs text-[var(--status-steady)] max-w-sm">
              <strong className="block font-semibold">Zero-Identification protocol active:</strong>
              Individual names, rankings, and raw activity logs are strictly redacted.
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              {
                key: "Green",
                word: "Steady",
                color: "var(--status-steady)",
                bg: "var(--status-steady-bg)",
                border: "var(--status-steady-border)",
                icon: STATUS_META.Green.icon,
                pct: status_distribution_pct.Green,
                count: status_distribution_counts.Green,
                desc: "Within personal baseline rhythms"
              },
              {
                key: "Yellow",
                word: "Stretched",
                color: "var(--status-stretched)",
                bg: "var(--status-stretched-bg)",
                border: "var(--status-stretched-border)",
                icon: STATUS_META.Yellow.icon,
                pct: status_distribution_pct.Yellow,
                count: status_distribution_counts.Yellow,
                desc: "Minor workload rhythm variances"
              },
              {
                key: "Orange",
                word: "Strained",
                color: "var(--status-strained)",
                bg: "var(--status-strained-bg)",
                border: "var(--status-strained-border)",
                icon: STATUS_META.Orange.icon,
                pct: status_distribution_pct.Orange,
                count: status_distribution_counts.Orange,
                desc: "Flagged 5+ days before exhaustion"
              },
              {
                key: "Red",
                word: "Overloaded",
                color: "var(--status-overloaded)",
                bg: "var(--status-overloaded-bg)",
                border: "var(--status-overloaded-border)",
                icon: STATUS_META.Red.icon,
                pct: status_distribution_pct.Red,
                count: status_distribution_counts.Red,
                desc: "Severe sustained multi-factor strain"
              }
            ].map((stat, idx) => (
              <div key={idx} className="ws-card p-5" style={{ borderColor: stat.border }}>
                <div className="flex items-center justify-between mb-2">
                  <div className="ws-badge text-xs" style={{ backgroundColor: stat.bg, color: stat.color }}>
                    {stat.icon}
                    <span>{stat.word}</span>
                  </div>
                  <span className="text-xs font-medium text-[var(--text-muted)]">{stat.count} members</span>
                </div>
                <div className="text-3xl font-bold mt-1" style={{ color: stat.color }}>{stat.pct}%</div>
                <p className="text-[11px] text-[var(--text-secondary)] mt-2">{stat.desc}</p>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="ws-card p-6">
              <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">30-day burnout trajectory</h3>
              <p className="text-xs text-[var(--text-secondary)] mb-4">Rolling percentage of department at elevated risk</p>
              <div className="h-44 flex items-end gap-1.5 pt-4 pb-1 border-b border-[var(--border-subtle)]">
                {trajectory_30d.slice(-15).map((pt, i) => {
                  const h = Math.max(10, (pt.pct_elevated_risk / 35.0) * 150);
                  const isHigh = pt.pct_elevated_risk > 20;
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center">
                      <div
                        className="w-full rounded-t transition-all"
                        style={{ height: `${h}px`, backgroundColor: isHigh ? "var(--status-strained)" : "var(--primary)" }}
                      />
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between text-xs text-[var(--text-muted)] mt-2">
                <span>15 days ago</span>
                <span>Today</span>
              </div>
            </div>

            <div className="ws-card p-6">
              <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">Primary behavioral contributors</h3>
              <p className="text-xs text-[var(--text-secondary)] mb-4">Aggregated across all team members</p>
              <div className="space-y-3">
                {category_drivers.map((cat, i) => (
                  <div key={i}>
                    <div className="flex justify-between text-xs font-medium text-[var(--text-primary)] mb-1">
                      <span>{cat.category}</span>
                      <span className="font-bold text-[var(--primary)]">{cat.attribution_pct}%</span>
                    </div>
                    <div className="w-full h-2 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden">
                      <div
                        className="h-full rounded-full"
                        style={{ width: `${cat.attribution_pct * 2}%`, backgroundColor: "var(--primary)" }}
                      />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // BAT-12 INTERACTIVE MODAL COMPONENT
    // =========================================================================
    function BAT12SurveyModal({ responses, setResponses, onSubmit, onClose, submitting, success }) {
      const handleRadio = (key, val) => {
        setResponses(prev => ({ ...prev, [key]: val }));
      };

      const ex = ((responses.bat_q1 + responses.bat_q2 + responses.bat_q3) / 3).toFixed(2);
      const md = ((responses.bat_q4 + responses.bat_q5 + responses.bat_q6) / 3).toFixed(2);
      const ei = ((responses.bat_q7 + responses.bat_q8 + responses.bat_q9) / 3).toFixed(2);
      const ci = ((responses.bat_q10 + responses.bat_q11 + responses.bat_q12) / 3).toFixed(2);
      const total = (Object.values(responses).reduce((a, b) => a + b, 0) / 12).toFixed(2);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop overflow-y-auto">
          <div className="ws-card max-w-2xl w-full p-6 md:p-8 my-8 relative shadow-2xl">
            <button
              onClick={onClose}
              className="absolute top-5 right-5 text-[var(--text-muted)] hover:text-[var(--text-primary)] text-xl font-bold"
            >
              &times;
            </button>

            <div className="mb-6">
              <span className="text-xs font-semibold uppercase tracking-wider text-[var(--primary)]">
                Burnout Assessment Tool (BAT-12)
              </span>
              <h2 className="text-xl font-bold text-[var(--text-primary)] mt-1">End-of-day psychological check-in</h2>
              <p className="text-xs text-[var(--text-secondary)] mt-1">
                Rate how often each statement applied to you during your workday today (1 = Never, 5 = Always).
              </p>
            </div>

            {/* Questions list */}
            <div className="space-y-3.5 max-h-[50vh] overflow-y-auto pr-2 divide-y divide-[var(--border-subtle)]">
              {BAT12_QUESTIONS.map((q) => (
                <div key={q.id} className="pt-3 first:pt-0">
                  <div className="flex items-center justify-between text-xs mb-1.5">
                    <span className="font-medium text-[var(--text-primary)]">{q.id}. {q.text}</span>
                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-[var(--bg-card-subtle)] text-[var(--text-secondary)] font-medium">
                      {q.dim}
                    </span>
                  </div>
                  <div className="grid grid-cols-5 gap-1.5">
                    {[
                      { val: 1, label: "Never" },
                      { val: 2, label: "Rarely" },
                      { val: 3, label: "Sometimes" },
                      { val: 4, label: "Often" },
                      { val: 5, label: "Always" },
                    ].map(opt => (
                      <button
                        key={opt.val}
                        type="button"
                        onClick={() => handleRadio(q.key, opt.val)}
                        className={`py-1.5 px-2 text-xs rounded-xl border text-center transition-all ${
                          responses[q.key] === opt.val
                            ? "bg-[var(--primary)] text-white border-[var(--primary)] font-bold shadow-xs"
                            : "bg-[var(--bg-card)] text-[var(--text-secondary)] border-[var(--border-subtle)] hover:bg-[var(--bg-card-subtle)]"
                        }`}
                      >
                        <div className="font-semibold">{opt.val}</div>
                        <div className="text-[10px] opacity-80">{opt.label}</div>
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            {/* Subscale summary preview */}
            <div className="mt-5 p-3 rounded-xl bg-[var(--bg-card-subtle)] border border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-3 text-xs">
              <div>Exhaustion: <strong className="text-[var(--text-primary)]">{ex}</strong></div>
              <div>Mental distance: <strong className="text-[var(--text-primary)]">{md}</strong></div>
              <div>Emotional: <strong className="text-[var(--text-primary)]">{ei}</strong></div>
              <div>Cognitive: <strong className="text-[var(--text-primary)]">{ci}</strong></div>
              <div className="border-l border-[var(--border-strong)] pl-3 text-[var(--primary)] font-semibold">
                Total score: <strong className="text-sm">{total} / 5.0</strong>
              </div>
            </div>

            {/* Submit and Cancel Buttons */}
            <div className="mt-6 flex items-center justify-end gap-3">
              <button onClick={onClose} className="ws-btn-secondary" disabled={submitting}>
                Cancel
              </button>
              <button onClick={onSubmit} className="ws-btn-primary" disabled={submitting}>
                {submitting ? "Submitting..." : success ? "&check; Check-in recorded!" : "Submit check-in"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>

</html>
