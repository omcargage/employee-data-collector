<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkSense — Early-Warning Burnout Prevention</title>
  
  <!-- Font Declarations from Segoe UI Variable Style Guide -->
  <style>
    @font-face {
      font-family: 'Segoe UI Variable Text';
      src: url('https://media.brand.dev/fonts/4c372cb2e01d890996a8ccb6cf285ff24a0542488a00e0046caf0c0703d4302a.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Segoe UI Variable Display';
      src: url('https://media.brand.dev/fonts/4c372cb2e01d890996a8ccb6cf285ff24a0542488a00e0046caf0c0703d4302a.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
    }

    :root {
      --color-accent: #0078d4;
      --color-background: #ffffff;
      --color-text: #000000;
      --font-text: 'Segoe UI Variable Text', 'Segoe UI', segoeui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --font-display: 'Segoe UI Variable Display', 'Segoe UI', segoeui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --shadow-md: rgba(0, 0, 0, 0.12) 0px 8px 32px 0px, rgba(0, 0, 0, 0.12) 0px 8px 16px 0px;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #fafbfc;
      color: var(--color-text);
      font-family: var(--font-text);
      font-size: 16px;
      line-height: 24px;
      letter-spacing: -0.48px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: var(--font-text);
      font-size: 42px;
      font-weight: 600;
      line-height: 50px;
      letter-spacing: -1.2px;
      margin: 0;
    }
    h2 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      line-height: 36px;
      letter-spacing: -0.8px;
      margin: 0;
    }
    h3 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.3px;
      margin: 0;
    }
    h4 {
      font-family: var(--font-text);
      font-size: 17px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: 0px;
      margin: 0;
    }

    .ws-card {
      background-color: #ffffff;
      border: 1px solid #eef2f6;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .ws-btn-primary {
      background-color: var(--color-accent);
      color: #ffffff;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      min-height: 40px;
      text-decoration: none;
    }
    .ws-btn-primary:hover {
      background-color: #0060aa;
    }
    .ws-btn-primary:active {
      transform: scale(0.98);
    }

    .ws-btn-secondary {
      background-color: transparent;
      color: #262626;
      border: 1px solid #262626;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
      min-height: 40px;
      text-decoration: none;
    }
    .ws-btn-secondary:hover {
      background-color: #f3f4f6;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }
  </style>

  <!-- Tailwind CSS CDN for fluid utility styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18, ReactDOM, and Babel Standalone for direct in-browser compilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // BAT-12 Questionnaire Definitions
    const BAT12_QUESTIONS = [
      { id: 1, key: "bat_q1", dim: "Exhaustion", text: "At work, I feel mentally exhausted" },
      { id: 2, key: "bat_q2", dim: "Exhaustion", text: "After a day at work, I find it hard to recover my energy" },
      { id: 3, key: "bat_q3", dim: "Exhaustion", text: "At work, I feel physically exhausted" },
      { id: 4, key: "bat_q4", dim: "Mental Distance", text: "I struggle to find any enthusiasm for my work" },
      { id: 5, key: "bat_q5", dim: "Mental Distance", text: "I feel a strong aversion towards my job" },
      { id: 6, key: "bat_q6", dim: "Mental Distance", text: "I'm cynical about what my work means to others" },
      { id: 7, key: "bat_q7", dim: "Emotional Impairment", text: "At work, I feel unable to control my emotions" },
      { id: 8, key: "bat_q8", dim: "Emotional Impairment", text: "I do not recognize myself in the way I react emotionally at work" },
      { id: 9, key: "bat_q9", dim: "Emotional Impairment", text: "At work I may overreact unintentionally" },
      { id: 10, key: "bat_q10", dim: "Cognitive Impairment", text: "At work, I have trouble staying focused" },
      { id: 11, key: "bat_q11", dim: "Cognitive Impairment", text: "When I'm working, I have trouble concentrating" },
      { id: 12, key: "bat_q12", dim: "Cognitive Impairment", text: "I make mistakes in my work because I have my mind on other things" }
    ];

    function App() {
      // Navigation & Role states
      const [viewRole, setViewRole] = useState("employee"); // "employee" or "manager"
      const [isDemoMode, setIsDemoMode] = useState(true);
      const [personas, setPersonas] = useState([]);
      const [selectedPersonaId, setSelectedPersonaId] = useState("EMP_089");
      const [employeeData, setEmployeeData] = useState(null);
      const [managerData, setManagerData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [showBatModal, setShowBatModal] = useState(false);
      const [batResponses, setBatResponses] = useState({});
      const [submittingBat, setSubmittingBat] = useState(false);
      const [batSubmittedSuccess, setBatSubmittedSuccess] = useState(false);

      // Fetch Personas on Mount
      useEffect(() => {
        fetch("/api/demo/personas")
          .then(res => res.json())
          .then(data => {
            setPersonas(data);
          })
          .catch(err => console.error("Error loading personas:", err));
      }, []);

      // Fetch Employee Dashboard Data
      const loadEmployeeData = (empId, mode) => {
        setLoading(true);
        const persona = personas.find(p => p.id === empId);
        const cutoff = persona ? persona.cutoff_day : null;
        const cutoffParam = cutoff ? `&day_cutoff=${cutoff}` : "";

        fetch(`/api/employee/dashboard?employee_id=${empId}&mode=${mode}${cutoffParam}`)
          .then(res => res.json())
          .then(data => {
            setEmployeeData(data);
            setLoading(false);
          })
          .catch(err => {
            console.error("Error loading employee data:", err);
            setLoading(false);
          });
      };

      // Fetch Manager Overview Data
      const loadManagerData = () => {
        setLoading(true);
        fetch("/api/manager/overview")
          .then(res => res.json())
          .then(data => {
            setManagerData(data);
            setLoading(false);
          })
          .catch(err => {
            console.error("Error loading manager data:", err);
            setLoading(false);
          });
      };

      useEffect(() => {
        if (viewRole === "employee") {
          loadEmployeeData(selectedPersonaId, isDemoMode ? "demo" : "live");
        } else {
          loadManagerData();
        }
      }, [viewRole, selectedPersonaId, isDemoMode]);

      // Initialize BAT-12 form default values
      useEffect(() => {
        const initial = {};
        BAT12_QUESTIONS.forEach(q => {
          initial[q.key] = 2; // Default Rarely
        });
        setBatResponses(initial);
      }, [showBatModal]);

      const handleBatSubmit = () => {
        setSubmittingBat(true);
        fetch("/api/employee/survey/bat12", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            employee_id: selectedPersonaId,
            logical_day: employeeData ? employeeData.current_date : null,
            items: batResponses
          })
        })
          .then(res => res.json())
          .then(res => {
            setSubmittingBat(false);
            setBatSubmittedSuccess(true);
            setTimeout(() => {
              setBatSubmittedSuccess(false);
              setShowBatModal(false);
              loadEmployeeData(selectedPersonaId, isDemoMode ? "demo" : "live");
            }, 1200);
          })
          .catch(err => {
            console.error("Error submitting BAT survey:", err);
            setSubmittingBat(false);
          });
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#fafbfc]">
          {/* Top Fluent Navigation Bar */}
          <header className="sticky top-0 z-40 bg-white border-b border-gray-200 px-6 py-3.5 shadow-sm">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              {/* Brand Logo & Name */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-[#0078d4] flex items-center justify-center text-white font-bold text-xl shadow-md">
                  W
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-xl tracking-tight text-black">WorkSense</span>
                    <span className="text-[11px] font-semibold uppercase px-2 py-0.5 rounded-full bg-blue-50 text-[#0078d4] border border-blue-200">
                      FLAME University
                    </span>
                  </div>
                  <div className="text-xs text-gray-500 font-normal">Early-Warning Burnout Prevention Tool</div>
                </div>
              </div>

              {/* Center Role Toggle (Employee Portal vs Manager Portal) */}
              <div className="flex items-center bg-gray-100 p-1 rounded-full border border-gray-200">
                <button
                  onClick={() => setViewRole("employee")}
                  className={`px-5 py-1.5 rounded-full text-sm font-semibold transition-all ${
                    viewRole === "employee"
                      ? "bg-[#0078d4] text-white shadow-sm"
                      : "text-gray-700 hover:text-black"
                  }`}
                >
                  Employee Portal
                </button>
                <button
                  onClick={() => setViewRole("manager")}
                  className={`px-5 py-1.5 rounded-full text-sm font-semibold transition-all ${
                    viewRole === "manager"
                      ? "bg-[#0078d4] text-white shadow-sm"
                      : "text-gray-700 hover:text-black"
                  }`}
                >
                  Manager / Employer Portal
                </button>
              </div>

              {/* Right Controls: Mode Toggle & Persona Switcher */}
              <div className="flex items-center gap-3">
                {/* Live vs Demo Toggle */}
                <div className="flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200 text-xs font-medium">
                  <span className={isDemoMode ? "text-gray-400" : "text-green-700 font-semibold"}>● Live EDC</span>
                  <button
                    onClick={() => setIsDemoMode(!isDemoMode)}
                    className="w-8 h-4 bg-gray-300 rounded-full p-0.5 transition-colors relative flex items-center"
                    style={{ backgroundColor: isDemoMode ? "#0078d4" : "#107c41" }}
                  >
                    <div
                      className={`w-3 h-3 bg-white rounded-full shadow-md transform transition-transform ${
                        isDemoMode ? "translate-x-4" : "translate-x-0"
                      }`}
                    />
                  </button>
                  <span className={isDemoMode ? "text-[#0078d4] font-semibold" : "text-gray-400"}>Demo Profiles</span>
                </div>

                {/* Persona Switcher Dropdown (in Employee Demo Mode) */}
                {viewRole === "employee" && isDemoMode && personas.length > 0 && (
                  <select
                    value={selectedPersonaId}
                    onChange={(e) => setSelectedPersonaId(e.target.value)}
                    className="text-xs font-semibold bg-white border border-gray-300 rounded-xl px-3 py-2 text-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#0078d4]"
                  >
                    {personas.map((p) => (
                      <option key={p.id} value={p.id}>
                        {p.title}
                      </option>
                    ))}
                  </select>
                )}
              </div>
            </div>
          </header>

          {/* Main Dashboard Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
            {loading ? (
              <div className="flex flex-col items-center justify-center py-24 text-gray-500">
                <div className="w-10 h-10 border-4 border-[#0078d4] border-t-transparent rounded-full animate-spin mb-4"></div>
                <div className="text-sm font-medium">Connecting to WorkSense Neural Engine...</div>
              </div>
            ) : viewRole === "employee" ? (
              <EmployeePortalView
                data={employeeData}
                onOpenBatModal={() => setShowBatModal(true)}
              />
            ) : (
              <ManagerPortalView data={managerData} />
            )}
          </main>

          {/* BAT-12 Daily Survey Modal */}
          {showBatModal && (
            <BAT12SurveyModal
              responses={batResponses}
              setResponses={setBatResponses}
              onSubmit={handleBatSubmit}
              onClose={() => setShowBatModal(false)}
              submitting={submittingBat}
              success={batSubmittedSuccess}
            />
          )}

          {/* Footer Privacy Guarantee */}
          <footer className="border-t border-gray-200 bg-white py-4 px-6 text-center text-xs text-gray-500">
            WorkSense — Built as an interdisciplinary research project at FLAME University, Pune. 
            <span className="ml-2 font-medium text-gray-700">Strict Zero-Identification Privacy Standard (No keystroke logging, no window titles, no text content).</span>
          </footer>
        </div>
      );
    }

    // =========================================================================
    // 1. EMPLOYEE PORTAL VIEW
    // =========================================================================
    function EmployeePortalView({ data, onOpenBatModal }) {
      if (!data) return null;

      const {
        name,
        role,
        department,
        current_date,
        calibration_progress,
        predicted_status_5d,
        confidence,
        risk_score,
        status_description,
        primary_drivers,
        relative_deviations,
        recent_7d_telemetry,
        recovery_nudges,
        bat12_summary,
      } = data;

      const isCalibrated = calibration_progress.is_calibrated;

      // Status Colors
      const statusMeta = {
        Green: { bg: "#e6f4ea", text: "#137333", border: "#ceead6", label: "Healthy Rhythm" },
        Yellow: { bg: "#fef7e0", text: "#b06000", border: "#feefc3", label: "Mild Strain (Caution)" },
        Orange: { bg: "#feefe3", text: "#c53929", border: "#fad2cf", label: "Elevated Risk (Early Warning)" },
        Red: { bg: "#fce8e6", text: "#c5221f", border: "#f5c2cb", label: "Acute Burnout Risk" },
        INSUFFICIENT_DATA: { bg: "#e8f0fe", text: "#1967d2", border: "#d2e3fc", label: "Calibrating Personal Baseline" }
      }[predicted_status_5d] || { bg: "#f1f3f4", text: "#5f6368", border: "#dadce0", label: "Calibrating" };

      return (
        <div className="space-y-6">
          {/* Employee Hero Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-gray-200 ws-card">
            <div>
              <div className="flex items-center gap-3">
                <h2>{name}</h2>
                <span className="text-xs px-2.5 py-1 rounded-full font-medium bg-gray-100 text-gray-700">
                  {role} • {department}
                </span>
              </div>
              <p className="text-gray-500 text-sm mt-1">
                Workspace Date: <span className="font-semibold text-gray-800">{current_date}</span>
                {data.mode === "live" && <span className="ml-2 text-green-600 font-semibold">• Live Machine Telemetry</span>}
              </p>
            </div>

            <div className="flex items-center gap-3">
              <button onClick={onOpenBatModal} className="ws-btn-primary">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                Complete Today's BAT-12 Survey
              </button>
            </div>
          </div>

          {/* Calibration Alert (if Days < 14) */}
          {!isCalibrated ? (
            <div className="p-6 rounded-2xl bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 ws-card">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2 text-[#0078d4] font-semibold text-sm uppercase tracking-wider">
                    <span>⏳ 14-Day Baseline Calibration in Progress</span>
                  </div>
                  <h3 className="mt-1 text-gray-900">
                    Day {calibration_progress.days_collected} of {calibration_progress.days_required} Completed
                  </h3>
                  <p className="text-sm text-gray-600 mt-1 max-w-2xl">
                    WorkSense is establishing your personal work baseline (typing pace, session stretches, lunch habits). 
                    No burnout alerts or manager reports are generated during this initial 14-day calibration window.
                  </p>
                </div>
                <div className="text-right flex flex-col items-end">
                  <div className="text-2xl font-bold text-[#0078d4]">{calibration_progress.progress_pct}%</div>
                  <div className="w-36 h-2.5 bg-blue-200 rounded-full overflow-hidden mt-1">
                    <div
                      className="h-full bg-[#0078d4] rounded-full transition-all duration-500"
                      style={{ width: `${calibration_progress.progress_pct}%` }}
                    ></div>
                  </div>
                  <span className="text-xs text-gray-500 mt-1">
                    BAT-12 Surveys: {calibration_progress.bat12_completed}/{calibration_progress.days_collected}
                  </span>
                </div>
              </div>
            </div>
          ) : null}

          {/* Core Telemetry Grid: Early-Warning Status & Recovery Nudges */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Status Card (5-Day Forward Prediction) */}
            <div className="lg:col-span-2 p-6 rounded-2xl bg-white border border-gray-200 ws-card flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <span className="text-xs font-semibold uppercase tracking-wider text-gray-500">
                      5-Day Forward Burnout Forecast
                    </span>
                    <h3 className="text-gray-900 mt-0.5">Impending Trajectory Status</h3>
                  </div>
                  <div
                    className="px-4 py-1.5 rounded-full text-sm font-semibold border"
                    style={{ backgroundColor: statusMeta.bg, color: statusMeta.text, borderColor: statusMeta.border }}
                  >
                    {statusMeta.label}
                  </div>
                </div>

                <div className="p-4 rounded-xl mb-4" style={{ backgroundColor: statusMeta.bg }}>
                  <div className="text-sm font-medium" style={{ color: statusMeta.text }}>
                    {status_description}
                  </div>
                  {isCalibrated && (
                    <div className="mt-3 flex items-center gap-6 text-xs text-gray-700">
                      <div>
                        Model Confidence: <span className="font-semibold">{(confidence * 100).toFixed(1)}%</span>
                      </div>
                      <div>
                        Continuous Risk Index: <span className="font-semibold">{risk_score ? (risk_score * 10).toFixed(1) : 0}/10</span>
                      </div>
                      <div>
                        Forecast Horizon: <span className="font-semibold">5+ Working Days</span>
                      </div>
                    </div>
                  )}
                </div>

                {/* Primary Category Drivers (Privacy Preserved) */}
                {primary_drivers && primary_drivers.length > 0 && (
                  <div>
                    <h4 className="text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">
                      Primary Behavioral Contributors
                    </h4>
                    <div className="space-y-2">
                      {primary_drivers.map((d, i) => (
                        <div key={i} className="flex items-center justify-between text-xs bg-gray-50 px-3 py-2 rounded-lg border border-gray-100">
                          <span className="font-medium text-gray-800">{d.label}</span>
                          <span className="font-bold text-[#0078d4]">{d.attribution_pct}%</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* Personal Baseline Verification Strip */}
              <div className="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                <div>
                  Personal Calibration Baseline: <span className="font-semibold text-gray-800">{bat12_summary.baseline_bat_status}</span> (BAT Mean: {bat12_summary.baseline_bat_score || "1.42"})
                </div>
                <div>
                  Today's Psychological Rating: <span className="font-semibold text-gray-800">{bat12_summary.today_status}</span> ({bat12_summary.today_score}/5.0)
                </div>
              </div>
            </div>

            {/* Smart Recovery Nudges */}
            <div className="p-6 rounded-2xl bg-white border border-gray-200 ws-card flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-gray-900">Recovery Nudges</h3>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-[#0078d4] font-semibold">
                    Personalized
                  </span>
                </div>
                <div className="space-y-3">
                  {recovery_nudges.map((nudge, idx) => (
                    <div key={idx} className="p-3.5 rounded-xl border border-blue-100 bg-blue-50/50">
                      <div className="font-semibold text-sm text-[#0078d4] flex items-center gap-2">
                        <span>●</span> {nudge.title}
                      </div>
                      <p className="text-xs text-gray-600 mt-1 leading-relaxed">
                        {nudge.message}
                      </p>
                    </div>
                  ))}
                </div>
              </div>

              <div className="mt-4 pt-3 border-t border-gray-100 text-[11px] text-gray-400">
                Nudges are private to you. No manager has access to your breaks or reminders.
              </div>
            </div>
          </div>

          {/* Relative Deviations from Personal Baseline (Z-Score Grid) */}
          <div className="p-6 rounded-2xl bg-white border border-gray-200 ws-card">
            <div className="flex items-center justify-between mb-4">
              <div>
                <span className="text-xs font-semibold uppercase tracking-wider text-gray-500">
                  Individual Deviation Scores (MAD Robust Z-Score)
                </span>
                <h3 className="text-gray-900 mt-0.5">Today vs. Your Personal 14-Day Baseline</h3>
              </div>
              <span className="text-xs text-gray-500">
                Zero = Your Normal | Positive = Increase | Negative = Decrease
              </span>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
              {[
                { label: "Longest Stretch", val: relative_deviations.work_stretch, unit: "MAD", hint: "Continuous work block" },
                { label: "After-Hours Work", val: relative_deviations.after_hours, unit: "MAD", hint: "Night active minutes" },
                { label: "Lunch Break", val: relative_deviations.lunch_break, unit: "MAD", hint: "Midday recovery" },
                { label: "Typing Pace", val: relative_deviations.typing_speed, unit: "MAD", hint: "Gross typing speed" },
                { label: "Correction Errors", val: relative_deviations.error_rate, unit: "MAD", hint: "Backspaces & deletes" },
                { label: "Focus Rhythm", val: relative_deviations.focus_fragmentation, unit: "MAD", hint: "Fragmentation ratio" },
              ].map((item, i) => {
                const isSpike = item.val > 2.0;
                const isDrop = item.val < -2.0;
                const color = isSpike || isDrop ? "#c53929" : "#137333";
                return (
                  <div key={i} className="p-3.5 rounded-xl border border-gray-200 bg-gray-50/70 text-center">
                    <div className="text-xs text-gray-500 truncate">{item.label}</div>
                    <div className="text-lg font-bold my-1" style={{ color }}>
                      {item.val > 0 ? `+${item.val}` : item.val}
                    </div>
                    <div className="text-[10px] text-gray-400 truncate">{item.hint}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Recent 7-Day Telemetry & Survey Trend */}
          <div className="p-6 rounded-2xl bg-white border border-gray-200 ws-card overflow-x-auto">
            <h3 className="text-gray-900 mb-4">Recent 7-Day Behavioral Observations</h3>
            <table className="w-full text-left text-xs text-gray-600">
              <thead className="bg-gray-50 text-gray-500 uppercase text-[10px] font-semibold border-b">
                <tr>
                  <th className="py-2.5 px-3">Date</th>
                  <th className="py-2.5 px-3">Continuous Stretch</th>
                  <th className="py-2.5 px-3">Lunch Duration</th>
                  <th className="py-2.5 px-3">After-Hours Msgs</th>
                  <th className="py-2.5 px-3">Typing Speed</th>
                  <th className="py-2.5 px-3">Error Ratio</th>
                  <th className="py-2.5 px-3">BAT-12 Score</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {recent_7d_telemetry.map((r, i) => (
                  <tr key={i} className="hover:bg-gray-50/50">
                    <td className="py-2 px-3 font-semibold text-gray-800">
                      {r.date} ({r.day_name})
                    </td>
                    <td className="py-2 px-3">{r.stretch_mins} mins</td>
                    <td className="py-2 px-3">{r.lunch_mins} mins</td>
                    <td className="py-2 px-3 font-medium">
                      <span className={r.after_hours_msgs > 5 ? "text-red-600 font-bold" : "text-gray-700"}>
                        {r.after_hours_msgs} msgs
                      </span>
                    </td>
                    <td className="py-2 px-3">{r.wpm} WPM</td>
                    <td className="py-2 px-3">{r.backspace_ratio}%</td>
                    <td className="py-2 px-3">
                      <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-gray-100 text-gray-800">
                        {r.bat_score} ({r.bat_status})
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. MANAGER / EMPLOYER PORTAL VIEW (PRIVACY-PRESERVED)
    // =========================================================================
    function ManagerPortalView({ data }) {
      if (!data) return null;

      const {
        department,
        reporting_period,
        total_workforce,
        active_monitored,
        status_distribution_pct,
        status_distribution_counts,
        trajectory_30d,
        category_drivers,
        privacy_compliance,
      } = data;

      return (
        <div className="space-y-6">
          {/* Manager Header */}
          <div className="bg-white p-6 rounded-2xl border border-gray-200 ws-card flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-blue-700">
                <span>🛡️ Executive Leadership & People Analytics</span>
              </div>
              <h2 className="mt-1">{department}</h2>
              <p className="text-gray-500 text-sm mt-0.5">
                Reporting Window: {reporting_period} • {total_workforce} Active Knowledge Workers
              </p>
            </div>
            <div className="text-xs bg-green-50 border border-green-200 text-green-800 p-3 rounded-xl max-w-sm">
              <span className="font-bold">Zero-Identification Active:</span> Raw keystrokes, individual names, and employee rankings are strictly redacted in accordance with the WHO Burnout Framework.
            </div>
          </div>

          {/* Department Status Distribution Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              {
                label: "Healthy Rhythms",
                color: "#137333",
                bg: "#e6f4ea",
                border: "#ceead6",
                pct: status_distribution_pct.Green,
                count: status_distribution_counts.Green,
                desc: "Working within calibrated personal baselines"
              },
              {
                label: "Mild Strain (Caution)",
                color: "#b06000",
                bg: "#fef7e0",
                border: "#feefc3",
                pct: status_distribution_pct.Yellow,
                count: status_distribution_counts.Yellow,
                desc: "Minor workload rhythm variances"
              },
              {
                label: "Elevated Risk (Early Warning)",
                color: "#c53929",
                bg: "#feefe3",
                border: "#fad2cf",
                pct: status_distribution_pct.Orange,
                count: status_distribution_counts.Orange,
                desc: "Flagged 5+ days prior to acute exhaustion"
              },
              {
                label: "Acute Burnout Risk",
                color: "#c5221f",
                bg: "#fce8e6",
                border: "#f5c2cb",
                pct: status_distribution_pct.Red,
                count: status_distribution_counts.Red,
                desc: "Sustained severe multi-factor behavioral collapse"
              }
            ].map((stat, idx) => (
              <div key={idx} className="p-5 rounded-2xl bg-white border ws-card" style={{ borderColor: stat.border }}>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-semibold uppercase tracking-wider text-gray-500 truncate">{stat.label}</span>
                  <span className="w-3 h-3 rounded-full" style={{ backgroundColor: stat.color }} />
                </div>
                <div className="text-3xl font-bold" style={{ color: stat.color }}>{stat.pct}%</div>
                <div className="text-xs font-medium text-gray-700 mt-1">{stat.count} Team Members</div>
                <p className="text-[11px] text-gray-400 mt-2">{stat.desc}</p>
              </div>
            ))}
          </div>

          {/* Trajectory & Category Drivers */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* 30-Day Aggregated Trend */}
            <div className="p-6 rounded-2xl bg-white border border-gray-200 ws-card">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <span className="text-xs font-semibold uppercase tracking-wider text-gray-500">Early Warning Signal</span>
                  <h3 className="text-gray-900 mt-0.5">30-Day Team Burnout Trajectory</h3>
                </div>
                <span className="text-xs font-semibold text-gray-500">Rolling % at Elevated Risk</span>
              </div>
              <div className="h-48 flex items-end gap-1.5 pt-4 pb-2 border-b border-gray-200">
                {trajectory_30d.map((pt, i) => {
                  const h = Math.max(12, (pt.pct_elevated_risk / 35.0) * 160);
                  const isHigh = pt.pct_elevated_risk > 20;
                  return (
                    <div key={i} className="flex-1 flex flex-col items-center group relative">
                      <div
                        className="w-full rounded-t transition-all hover:opacity-80"
                        style={{ height: `${h}px`, backgroundColor: isHigh ? "#c53929" : "#0078d4" }}
                      />
                      <div className="opacity-0 group-hover:opacity-100 transition-opacity absolute bottom-full mb-1 text-[10px] bg-black text-white px-1.5 py-0.5 rounded whitespace-nowrap z-20 pointer-events-none">
                        {pt.date}: {pt.pct_elevated_risk}%
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between text-[11px] text-gray-400 mt-2">
                <span>30 Days Ago</span>
                <span>15 Days Ago</span>
                <span>Today</span>
              </div>
            </div>

            {/* The 4 Broad Category Attribution Bars */}
            <div className="p-6 rounded-2xl bg-white border border-gray-200 ws-card">
              <span className="text-xs font-semibold uppercase tracking-wider text-gray-500">Privacy Attribution Breakdown</span>
              <h3 className="text-gray-900 mt-0.5 mb-4">Primary Drivers Across Department</h3>
              <div className="space-y-4">
                {category_drivers.map((cat, i) => (
                  <div key={i}>
                    <div className="flex justify-between text-xs font-medium text-gray-800 mb-1">
                      <span>{cat.category}</span>
                      <span className="font-bold text-[#0078d4]">{cat.attribution_pct}%</span>
                    </div>
                    <div className="w-full h-2.5 bg-gray-100 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-[#0078d4] rounded-full"
                        style={{ width: `${cat.attribution_pct * 2}%` }}
                      />
                    </div>
                    <div className="text-[11px] text-gray-400 mt-1">{cat.description}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. BAT-12 INTERACTIVE DAILY SURVEY MODAL
    // =========================================================================
    function BAT12SurveyModal({ responses, setResponses, onSubmit, onClose, submitting, success }) {
      const handleRadio = (key, val) => {
        setResponses(prev => ({ ...prev, [key]: val }));
      };

      // Live compute subscales
      const ex = ((responses.bat_q1 + responses.bat_q2 + responses.bat_q3) / 3).toFixed(2);
      const md = ((responses.bat_q4 + responses.bat_q5 + responses.bat_q6) / 3).toFixed(2);
      const ei = ((responses.bat_q7 + responses.bat_q8 + responses.bat_q9) / 3).toFixed(2);
      const ci = ((responses.bat_q10 + responses.bat_q11 + responses.bat_q12) / 3).toFixed(2);
      const total = (
        Object.values(responses).reduce((a, b) => a + b, 0) / 12
      ).toFixed(2);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop overflow-y-auto">
          <div className="bg-white rounded-2xl border border-gray-200 shadow-2xl max-w-3xl w-full p-6 md:p-8 my-8 relative">
            <button
              onClick={onClose}
              className="absolute top-5 right-5 text-gray-400 hover:text-gray-700 text-xl font-bold"
            >
              ✕
            </button>

            <div className="mb-6">
              <span className="text-xs font-semibold uppercase tracking-wider text-[#0078d4]">
                Burnout Assessment Tool (BAT-12 Short Version)
              </span>
              <h2 className="text-gray-900 mt-1">End-of-Day Psychological Pulse</h2>
              <p className="text-sm text-gray-500 mt-1">
                Rate how often each statement applied to you during your workday today (1 = Never, 5 = Always).
              </p>
            </div>

            {/* Survey Items */}
            <div className="space-y-4 max-h-[50vh] overflow-y-auto pr-2 divide-y divide-gray-100">
              {BAT12_QUESTIONS.map((q) => (
                <div key={q.id} className="pt-3 first:pt-0">
                  <div className="flex items-center justify-between text-xs text-gray-500 mb-1">
                    <span className="font-semibold text-gray-800">Item {q.id}. {q.text}</span>
                    <span className="text-[11px] bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-medium">
                      {q.dim}
                    </span>
                  </div>
                  <div className="grid grid-cols-5 gap-2 mt-2">
                    {[
                      { val: 1, label: "Never" },
                      { val: 2, label: "Rarely" },
                      { val: 3, label: "Sometimes" },
                      { val: 4, label: "Often" },
                      { val: 5, label: "Always" },
                    ].map(opt => (
                      <button
                        key={opt.val}
                        type="button"
                        onClick={() => handleRadio(q.key, opt.val)}
                        className={`py-1.5 px-2 text-xs rounded-xl border text-center transition-all ${
                          responses[q.key] === opt.val
                            ? "bg-[#0078d4] text-white border-[#0078d4] font-bold shadow-sm"
                            : "bg-white text-gray-700 border-gray-200 hover:bg-gray-50"
                        }`}
                      >
                        <div>{opt.val}</div>
                        <div className="text-[10px] opacity-80">{opt.label}</div>
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            {/* Live Subscale Preview Strip */}
            <div className="mt-6 p-4 rounded-xl bg-gray-50 border border-gray-200 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div>Exhaustion: <span className="font-bold text-gray-800">{ex}</span></div>
              <div>Mental Distance: <span className="font-bold text-gray-800">{md}</span></div>
              <div>Emotional: <span className="font-bold text-gray-800">{ei}</span></div>
              <div>Cognitive: <span className="font-bold text-gray-800">{ci}</span></div>
              <div className="border-l pl-3 font-semibold text-[#0078d4]">
                Total Score: <span className="text-base font-bold">{total} / 5.0</span>
              </div>
            </div>

            {/* Submit Actions */}
            <div className="mt-6 flex items-center justify-end gap-3">
              <button onClick={onClose} className="ws-btn-secondary" disabled={submitting}>
                Cancel
              </button>
              <button onClick={onSubmit} className="ws-btn-primary" disabled={submitting}>
                {submitting ? "Submitting..." : success ? "✓ Survey Recorded!" : "Submit Daily Survey"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
