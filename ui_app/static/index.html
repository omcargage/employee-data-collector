<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkSense — Early-Warning Burnout Prevention</title>

  <!-- WorkSense App Icons & PWA Metadata -->
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1F5C63">

  <script>
    // Global fallback for unhandled exceptions to prevent blank screen
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F7F6F3;padding:24px;font-family:sans-serif;">' +
          '<div style="max-width:480px;background:#fff;border:1px solid #E8E6DF;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);text-align:center;">' +
          '<h2 style="font-size:20px;font-weight:700;color:#181816;margin-bottom:8px;">Unable to initialize WorkSense</h2>' +
          '<p style="font-size:14px;color:#54524C;line-height:1.5;margin-bottom:24px;">A runtime error occurred during startup. Please reload or restart the application.</p>' +
          '<button onclick="location.reload()" style="background:#1F5C63;color:#fff;border:none;padding:10px 24px;border-radius:9999px;font-size:14px;font-weight:600;cursor:pointer;">Reload WorkSense</button>' +
          '<details style="margin-top:20px;text-align:left;font-size:12px;color:#8A8880;"><summary style="cursor:pointer;">Technical details</summary>' +
          '<pre style="white-space:pre-wrap;background:#F0EFEA;padding:12px;border-radius:8px;margin-top:8px;overflow-x:auto;">' + (e.message || 'Unknown error') + '\n' + (e.filename ? e.filename + ':' + e.lineno : '') + '</pre>' +
          '</details></div></div>';
      }
    });
  </script>

  <!-- Optional Web Font: Inter (non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Tailwind CSS (Local Vendor) -->
  <script src="/static/vendor/tailwindcss.js"></script>

  <!-- Design Tokens (CSS Variables: Light and Dark set) -->
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Light Theme — All text tokens strictly WCAG AA >= 4.5:1 contrast */
      --bg-app: #F7F6F3;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #F0EFEA;
      --bg-card-hover: #FAF9F6;
      --border-subtle: #E8E6DF;
      --border-strong: #D5D2C8;
      --text-primary: #181816;       /* Contrast ratio: 16.6:1 (AAA) */
      --text-secondary: #54524C;     /* Contrast ratio: 7.8:1 (AAA) */
      --text-muted: #6B6860;         /* Contrast ratio: 5.0:1 (AA >= 4.5:1) */

      --primary: #1F5C63;            /* Deep teal, contrast ratio: 6.4:1 (AA) */
      --primary-hover: #17484E;
      --primary-subtle: rgba(31, 92, 99, 0.08);
      --primary-border: rgba(31, 92, 99, 0.25);
      --primary-text: #FFFFFF;

      /* Status Colors (always paired with icon + word, >= 4.5:1 contrast) */
      /* Steady = sage */
      --status-steady: #376842;        /* Contrast: 5.6:1 (AA) */
      --status-steady-bg: #EDF4EF;
      --status-steady-border: #C8DEC9;

      /* Stretched = sand */
      --status-stretched: #8A6014;     /* Contrast: 5.1:1 (AA) */
      --status-stretched-bg: #FBF5E8;
      --status-stretched-border: #EFE0BD;

      /* Strained = terracotta */
      --status-strained: #AC4422;      /* Contrast: 5.4:1 (AA) */
      --status-strained-bg: #FAECE6;
      --status-strained-border: #F1CBBF;

      /* Overloaded = deep rose */
      --status-overloaded: #A12E44;    /* Contrast: 6.5:1 (AA) */
      --status-overloaded-bg: #F7E8EB;
      --status-overloaded-border: #ECC1CA;

      /* Calibrating / Neutral = slate */
      --status-calibrating: #3F5965;   /* Contrast: 5.8:1 (AA) */
      --status-calibrating-bg: #EDF2F4;
      --status-calibrating-border: #CFD8DC;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 18px;
      --radius-pill: 9999px;

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-card: 0 3px 14px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.05), 0 -1px 3px rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] {
      --bg-app: #151615;
      --bg-sidebar: #1C1E1C;
      --bg-card: #222422;
      --bg-card-subtle: #2B2E2B;
      --bg-card-hover: #272A27;
      --border-subtle: #2F332F;
      --border-strong: #404540;
      --text-primary: #F3F3F1;         /* Contrast: 13.5:1 (AAA) */
      --text-secondary: #C2C5BE;       /* Contrast: 8.6:1 (AAA) */
      --text-muted: #9DA09A;           /* Contrast: 5.5:1 (AA) */

      --primary: #4AB1BC;              /* Contrast: 7.2:1 (AAA) */
      --primary-hover: #5FC1CC;
      --primary-subtle: rgba(74, 177, 188, 0.15);
      --primary-border: rgba(74, 177, 188, 0.35);
      --primary-text: #FFFFFF;

      --status-steady: #78B585;        /* Contrast: 7.2:1 (AA) */
      --status-steady-bg: rgba(55, 104, 66, 0.25);
      --status-steady-border: rgba(120, 181, 133, 0.4);

      --status-stretched: #E5B65A;     /* Contrast: 8.6:1 (AAA) */
      --status-stretched-bg: rgba(138, 96, 20, 0.25);
      --status-stretched-border: rgba(229, 182, 90, 0.4);

      --status-strained: #F08B6B;      /* Contrast: 7.0:1 (AA) */
      --status-strained-bg: rgba(172, 68, 34, 0.25);
      --status-strained-border: rgba(240, 139, 107, 0.4);

      --status-overloaded: #E06D83;    /* Contrast: 5.8:1 (AA) */
      --status-overloaded-bg: rgba(161, 46, 68, 0.25);
      --status-overloaded-border: rgba(224, 109, 131, 0.4);

      --status-calibrating: #8EB0BF;   /* Contrast: 7.5:1 (AA) */
      --status-calibrating-bg: rgba(63, 89, 101, 0.25);
      --status-calibrating-border: rgba(142, 176, 191, 0.4);

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-dock: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    /* Accessible focus rings (WCAG 2.4.7 Focus Visible) */
    :focus-visible {
      outline: 2px solid var(--primary) !important;
      outline-offset: 2px !important;
      border-radius: var(--radius-sm);
    }

    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, [tabindex="0"]:focus-visible {
      outline: 2px solid var(--primary) !important;
      outline-offset: 2px !important;
    }

    /* Reduced-motion support (WCAG 2.3.3 Animation from Interactions) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .ws-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ws-btn-primary {
      background-color: var(--primary);
      color: var(--primary-text);
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 38px;
      text-decoration: none;
    }

    .ws-btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .ws-btn-secondary {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 38px;
      text-decoration: none;
    }

    .ws-btn-secondary:hover {
      background-color: var(--bg-card-subtle);
    }

    .ws-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .ws-skeleton {
      background: linear-gradient(90deg, var(--bg-card-subtle) 25%, var(--bg-card-hover) 50%, var(--bg-card-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 9999px;
    }
  </style>

  <!-- React 18, ReactDOM, and Babel Standalone (Local Vendor - 100% Offline Reliable) -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
  <script src="/static/vendor/babel.min.js"></script>
  <!-- WorkSense Centralized User-Facing Copy & Tooltips -->
  <script src="/static/strings.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // STATUS METADATA: ALWAYS ICON + WORD (NEVER COLOR ALONE)
    // Sage = Steady, Sand = Stretched, Terracotta = Strained, Deep Rose = Overloaded
    // =========================================================================
    const STATUS_META = {
      Green: {
        word: "Steady",
        color: "var(--status-steady)",
        bg: "var(--status-steady-bg)",
        border: "var(--status-steady-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        ),
        sentence: "Your work pattern is steady and matching your usual pace. Keep up your balanced rhythm.",
        action: "Maintain your regular lunch and stretch blocks today."
      },
      Yellow: {
        word: "Stretched",
        color: "var(--status-stretched)",
        bg: "var(--status-stretched-bg)",
        border: "var(--status-stretched-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        ),
        sentence: "Your work pattern has shifted a little from your usual. Nothing urgent, but protect your breaks this week.",
        action: "Block out a 15-minute quiet recovery window this afternoon."
      },
      Orange: {
        word: "Strained",
        color: "var(--status-strained)",
        bg: "var(--status-strained-bg)",
        border: "var(--status-strained-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        ),
        sentence: "Your work pattern shows noticeable strain building up across recent days. Prioritize recovery and protect your boundaries.",
        action: "End work at your scheduled shift time tonight with no late emails."
      },
      Red: {
        word: "Overloaded",
        color: "var(--status-overloaded)",
        bg: "var(--status-overloaded-bg)",
        border: "var(--status-overloaded-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
          </svg>
        ),
        sentence: "Your working rhythms show sustained high fatigue and boundary erosion. Consider speaking with your team and taking restorative rest.",
        action: "Speak with your team lead about workload rebalancing and step away for an extended pause."
      },
      INSUFFICIENT_DATA: {
        word: "No status today",
        color: "var(--status-calibrating)",
        bg: "var(--status-calibrating-bg)",
        border: "var(--status-calibrating-border)",
        icon: (
          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M20 12H4" />
          </svg>
        ),
        sentence: "No work activity recorded today or weekend rest day. Enjoy your time away from the screen.",
        action: "Rest and recharge."
      }
    };

    // BAT-12 Short Version Questionnaire
    const BAT12_QUESTIONS = [
      { id: 1, key: "bat_q1", dim: "Physical tiredness", text: "At work, I feel mentally exhausted" },
      { id: 2, key: "bat_q2", dim: "Physical tiredness", text: "After a day at work, I find it hard to recover my energy" },
      { id: 3, key: "bat_q3", dim: "Physical tiredness", text: "At work, I feel physically exhausted" },
      { id: 4, key: "bat_q4", dim: "Motivation & energy", text: "I struggle to find any enthusiasm for my work" },
      { id: 5, key: "bat_q5", dim: "Motivation & energy", text: "I feel a strong aversion towards my job" },
      { id: 6, key: "bat_q6", dim: "Motivation & energy", text: "I'm cynical about what my work means to others" },
      { id: 7, key: "bat_q7", dim: "Daily stress & mood", text: "At work, I feel unable to control my emotions" },
      { id: 8, key: "bat_q8", dim: "Daily stress & mood", text: "I do not recognize myself in the way I react emotionally at work" },
      { id: 9, key: "bat_q9", dim: "Daily stress & mood", text: "At work I may overreact unintentionally" },
      { id: 10, key: "bat_q10", dim: "Mental focus", text: "At work, I have trouble staying focused" },
      { id: 11, key: "bat_q11", dim: "Mental focus", text: "When I'm working, I have trouble concentrating" },
      { id: 12, key: "bat_q12", dim: "Mental focus", text: "I make mistakes in my work because I have my mind on other things" }
    ];

    // 4 Groups of BAT-12 (One group per step in Day Check-in form)
    const BAT12_GROUPS = [
      {
        step: 1,
        key: "exhaustion",
        title: "Physical tiredness",
        subtitle: "Physical and mental energy recovery after your workday.",
        questions: BAT12_QUESTIONS.slice(0, 3)
      },
      {
        step: 2,
        key: "mental_distance",
        title: "Motivation & energy",
        subtitle: "Enthusiasm, purpose, and connection to your daily work.",
        questions: BAT12_QUESTIONS.slice(3, 6)
      },
      {
        step: 3,
        key: "emotional_impairment",
        title: "Daily stress & mood",
        subtitle: "Emotional balance and composure during busy situations.",
        questions: BAT12_QUESTIONS.slice(6, 9)
      },
      {
        step: 4,
        key: "cognitive_impairment",
        title: "Mental focus",
        subtitle: "Concentration, mental clarity, and focus stamina.",
        questions: BAT12_QUESTIONS.slice(9, 12)
      }
    ];

    // =========================================================================
    // HELPER: Friendly Unit Formatter ("1h 26m", not "86.4 mins")
    // =========================================================================
    function toFriendlyUnits(metricKey, val) {
      if (val === undefined || val === null) return "--";
      const num = Number(val);
      if (isNaN(num)) return val;

      if (["stretch", "stretch_mins", "lunch", "lunch_mins", "focus", "focus_mins", "after_hours_mins"].includes(metricKey)) {
        const mins = Math.round(num);
        if (mins >= 60) {
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }
        return `${mins}m`;
      }
      if (metricKey === "after_hours_msgs") {
        return `${Math.round(num)} msgs`;
      }
      if (metricKey === "wpm") {
        return `${Math.round(num)} WPM`;
      }
      if (metricKey === "backspace_ratio") {
        return `${num.toFixed(1)}%`;
      }
      if (["mouse", "mouse_speed"].includes(metricKey)) {
        return `${Math.round(num)} px/s`;
      }
      return `${num}`;
    }

    // =========================================================================
    // HELPER: BAT-12 Official Percentile Category Mapping & Badges
    // =========================================================================
    function getBatPercentileCategory(score, dimension = "total") {
      if (score === undefined || score === null || isNaN(Number(score))) return "Low";
      const s = Number(score);
      if (dimension === "mental_distance" || dimension === "emotional_impairment") {
        if (s >= 3.33) return "Very high";
        if (s >= 2.33) return "High";
        if (s >= 1.33) return "Average";
        return "Low";
      } else if (dimension === "exhaustion" || dimension === "cognitive_impairment") {
        if (s >= 3.67) return "Very high";
        if (s >= 2.67) return "High";
        if (s >= 1.67) return "Average";
        return "Low";
      } else {
        // Total BAT-12 norm thresholds
        if (s >= 3.65) return "Very high";
        if (s >= 2.67) return "High";
        if (s >= 1.67) return "Average";
        return "Low";
      }
    }

    function getCategoryBadgeClass(category) {
      const cat = String(category || "").toLowerCase();
      if (cat.includes("very high")) {
        return "bg-rose-50 text-rose-700 dark:bg-rose-950/40 dark:text-rose-300 border-rose-200 dark:border-rose-800";
      }
      if (cat.includes("high")) {
        return "bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300 border-amber-200 dark:border-amber-800";
      }
      if (cat.includes("average")) {
        return "bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-300 border-blue-200 dark:border-blue-800";
      }
      return "bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800";
    }

    const STRINGS = window.WORK_SENSE_STRINGS || {};

    // =========================================================================
    // REUSABLE COMPONENT: ErrorState (Accessible with Retry and Recovery Tips)
    // =========================================================================
    function ErrorState({ title, description, onRetry, errorDetails }) {
      const errTitle = title || STRINGS?.states?.error?.title || "Unable to load data";
      const errDesc = description || STRINGS?.states?.error?.description || "An error occurred while communicating with the local WorkSense bridge server.";
      const retryBtn = STRINGS?.states?.error?.retryButton || "Try again";
      const offlineTip = STRINGS?.states?.error?.offlineTip || "Ensure desktop.py or worksense.bat is active on your workstation.";

      return (
        <div role="alert" aria-live="assertive" className="ws-card p-8 sm:p-10 text-center flex flex-col items-center justify-center border-l-4 border-[var(--status-strained)]">
          <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-4 bg-[var(--status-strained-bg)] text-[var(--status-strained)] border border-[var(--status-strained)]/20">
            <svg className="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <h3 className="text-base font-bold text-[var(--text-primary)] mb-1.5">{errTitle}</h3>
          <p className="text-sm text-[var(--text-secondary)] max-w-md mb-2 leading-relaxed">{errDesc}</p>
          {errorDetails && (
            <div className="text-[11px] font-mono text-[var(--text-muted)] bg-[var(--bg-card-subtle)] px-2.5 py-1 rounded-md mb-4 max-w-lg truncate">
              {String(errorDetails)}
            </div>
          )}
          <p className="text-xs text-[var(--text-muted)] mb-5 max-w-sm">{offlineTip}</p>
          {onRetry && (
            <button
              onClick={onRetry}
              className="px-4 py-2 rounded-xl bg-[var(--primary)] text-white text-xs font-semibold hover:bg-[var(--primary-hover)] transition-all shadow-sm flex items-center gap-2 focus-visible:ring-2"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              {retryBtn}
            </button>
          )}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: TermTooltip ("What's this?" Interactive Technical Tooltip)
    // Accessible via Hover, Focus, Enter/Space, and Escape
    // =========================================================================
    function TermTooltip({ termKey, label, children }) {
      const [isOpen, setIsOpen] = useState(false);
      const tooltipData = STRINGS?.tooltips?.[termKey] || {
        term: label || "Technical term",
        short: label || "Technical term",
        description: "Technical parameter used in WorkSense behavioral rhythm modeling."
      };

      const displayText = label || tooltipData.term;

      return (
        <span className="relative inline-flex items-center gap-1 group">
          {children || <span className="underline decoration-dotted decoration-[var(--border-strong)] underline-offset-4 cursor-help">{displayText}</span>}
          <button

            onClick={(e) => {
              e.stopPropagation();
              setIsOpen(!isOpen);

            onMouseEnter={() => setIsOpen(true)}
            onMouseLeave={() => setIsOpen(false)}
            onFocus={() => setIsOpen(true)}
            onBlur={() => setIsOpen(false)}
            onKeyDown={(e) => {
              if (e.key === "Escape") setIsOpen(false);
            }}
            aria-label={`What is ${tooltipData.term}?`}
            aria-expanded={isOpen}
            className="w-4 h-4 rounded-full bg-[var(--bg-card-subtle)] hover:bg-[var(--primary-subtle)] text-[var(--text-muted)] hover:text-[var(--primary)] flex items-center justify-center text-[10px] font-bold border border-[var(--border-subtle)] transition-colors shrink-0"

    // =========================================================================
    // REUSABLE COMPONENT: DeviationBar
    // Center = "Your usual", Bands: Typical / A bit different / Much different
    // Shows "changed" instead of "worse" for ambiguous metrics (typing speed).
    // Exact numbers on hover.
    // =========================================================================
    function DeviationBar({ item }) {
      const [hovered, setHovered] = useState(false);
      const val = item.value || 0;
      const absVal = Math.abs(val);

      let bandLabel = "Typical";
      let bandColor = "var(--text-secondary)";
      let bandBg = "var(--bg-card-subtle)";
      let barColor = "var(--border-strong)";

      if (absVal >= 2.5) {
        bandLabel = "Much different";
        bandColor = "var(--status-overloaded)";
        bandBg = "var(--status-overloaded-bg)";
        barColor = "var(--status-overloaded)";
      } else if (absVal >= 1.2) {
        bandLabel = "A bit different";
        bandColor = "var(--status-stretched)";
        bandBg = "var(--status-stretched-bg)";
        barColor = "var(--status-stretched)";
      }

      const clampedPct = Math.min(48, (absVal / 5.0) * 48);

      return (
        <div
          className="p-3.5 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card)] relative transition-all hover:border-[var(--border-strong)]"
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          <div className="flex items-center justify-between text-xs mb-1.5">
            <span className="font-semibold text-[var(--text-primary)]">{item.displayLabel}</span>
            <span
              className="px-2 py-0.5 rounded-full text-[11px] font-medium"
              style={{ backgroundColor: bandBg, color: bandColor }}
            >
              {bandLabel}
            </span>
          </div>

          <div className="relative h-2.5 bg-[var(--bg-card-subtle)] rounded-full overflow-hidden my-2">
            <div className="absolute top-0 bottom-0 left-1/2 w-0.5 bg-[var(--text-muted)] z-10" />

            {val < 0 ? (
              <div
                className="absolute top-0 bottom-0 rounded-l-full transition-all duration-300"
                style={{
                  right: "50%",
                  width: `${clampedPct}%`,
                  backgroundColor: barColor
                }}
              />
            ) : (
              <div
                className="absolute top-0 bottom-0 rounded-r-full transition-all duration-300"
                style={{
                  left: "50%",
                  width: `${clampedPct}%`,
                  backgroundColor: barColor
                }}
              />
            )}
          </div>

          <div className="flex justify-between items-center text-[10px] text-[var(--text-muted)]">
            <span>Lower</span>
            <span className="font-semibold text-[var(--text-secondary)]">Your usual</span>
            <span>Higher</span>
          </div>

          {hovered && (
            <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1 px-2.5 rounded-lg shadow-lg whitespace-nowrap z-30 pointer-events-none">
              <span className="font-semibold">{item.hoverMetric}</span> &bull; {val > 0 ? `+${val}` : val} MAD from usual
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // REUSABLE COMPONENT: MetricTrendLineCard
    // Metric card with line chart, shaded "your normal" band, 7/30d toggle,
    // friendly units, and "What this means".
    // =========================================================================
    function MetricTrendLineCard({
      title,
      metricKey,
      meaningSentence,
      data7d = [],
      data30d = [],
      baselineBand = { median: 50, min: 30, max: 70 },
      timeRange = "7d", // "7d" or "30d"
      onToggleTimeRange
    }) {
      const [hoveredPoint, setHoveredPoint] = useState(null);

      // Select active telemetry slice
      const activeData = timeRange === "7d" ? data7d : data30d;
      const latestItem = activeData[activeData.length - 1] || {};
      const todayRawVal = latestItem[metricKey] || 0;
      const todayFriendlyVal = toFriendlyUnits(metricKey, todayRawVal);

      // SVG Dimensions
      const width = 460;
      const height = 150;
      const padTop = 18;
      const padBottom = 26;
      const padLeft = 24;
      const padRight = 24;
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      // Extract values to compute scale
      const values = activeData.map(d => Number(d[metricKey]) || 0);
      const bMin = baselineBand.min !== undefined ? baselineBand.min : 0;
      const bMax = baselineBand.max !== undefined ? baselineBand.max : 100;

      const minVal = Math.max(0, Math.min(bMin * 0.85, ...values));
      const maxVal = Math.max(bMax * 1.15, ...values, 10);
      const rangeVal = maxVal - minVal || 1;

      const getX = (idx) => padLeft + (idx / Math.max(1, activeData.length - 1)) * chartW;
      const getY = (v) => padTop + chartH - ((Math.max(minVal, Math.min(maxVal, v)) - minVal) / rangeVal) * chartH;

      // Shaded Band coordinates
      const bandTopY = getY(bMax);
      const bandBottomY = getY(bMin);
      const bandHeight = Math.max(4, bandBottomY - bandTopY);

      // Generate Line Path
      const points = activeData.map((d, i) => ({
        x: getX(i),
        y: getY(Number(d[metricKey]) || 0),
        val: d[metricKey],
        date: d.date,
        dayName: d.day_name,
        isWeekend: d.is_weekend
      }));

      const linePath = points.length > 0
        ? points.reduce((acc, pt, i) => `${acc} ${i === 0 ? "M" : "L"} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`, "")
        : "";

      return (
        <div className="ws-card p-5 flex flex-col justify-between">
          <div>
            {/* Top Row: Metric Title, Friendly Today Value & Time Range Toggle */}
            <div className="flex items-start justify-between gap-3 mb-2">
              <div>
                <h4 className="text-sm font-semibold text-[var(--text-primary)]">{title}</h4>
                <div className="flex items-baseline gap-2 mt-0.5">
                  <span className="text-xl font-bold text-[var(--text-primary)]">{todayFriendlyVal}</span>
                  <span className="text-[11px] text-[var(--text-muted)]">today</span>
                </div>
              </div>

              {/* 7/30d Segmented Toggle */}
              <div className="flex items-center bg-[var(--bg-card-subtle)] p-0.5 rounded-full border border-[var(--border-subtle)] text-[11px] shrink-0">
                <button
                  type="button"
                  onClick={() => onToggleTimeRange("7d")}
                  className={`px-2.5 py-0.5 rounded-full font-medium transition-all ${
                    timeRange === "7d"
                      ? "bg-[var(--primary)] text-white shadow-xs font-semibold"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}
                >
                  7d
                </button>
                <button
                  type="button"
                  onClick={() => onToggleTimeRange("30d")}
                  className={`px-2.5 py-0.5 rounded-full font-medium transition-all ${
                    timeRange === "30d"
                      ? "bg-[var(--primary)] text-white shadow-xs font-semibold"
                      : "text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                  }`}
                >
                  30d
                </button>
              </div>
            </div>

            {/* SVG Line Chart with Shaded "Your Normal" Band */}
            <div className="relative my-2">
              <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-36 overflow-visible">
                {/* Shaded "Your Normal" Band */}
                <rect
                  x={padLeft}
                  y={bandTopY}
                  width={chartW}
                  height={bandHeight}
                  fill="var(--primary-subtle)"
                  stroke="var(--primary-border)"
                  strokeDasharray="2 2"
                  rx="4"
                />

                {/* Shaded Band Label */}
                <text
                  x={padLeft + 6}
                  y={bandTopY + 11}
                  fill="var(--primary)"
                  fontSize="9"
                  fontWeight="600"
                  className="select-none opacity-80"
                >
                  Your normal ({toFriendlyUnits(metricKey, bMin)} &ndash; {toFriendlyUnits(metricKey, bMax)})
                </text>

                {/* Actual Data Trend Line */}
                <path
                  d={linePath}
                  fill="none"
                  stroke="var(--primary)"
                  strokeWidth="2.4"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />

                {/* Data Points */}
                {points.map((pt, idx) => (
                  <circle
                    key={idx}
                    cx={pt.x}
                    cy={pt.y}
                    r={hoveredPoint === idx ? 5 : 3}
                    fill="var(--bg-card)"
                    stroke="var(--primary)"
                    strokeWidth="2"
                    className="cursor-pointer transition-all"
                    onMouseEnter={() => setHoveredPoint(idx)}
                    onMouseLeave={() => setHoveredPoint(null)}
                  />
                ))}
              </svg>

              {/* Hover Tooltip Box */}
              {hoveredPoint !== null && points[hoveredPoint] && (
                <div
                  className="absolute bg-[var(--text-primary)] text-[var(--bg-card)] text-[11px] py-1 px-2.5 rounded-lg shadow-lg pointer-events-none z-20 whitespace-nowrap transform -translate-x-1/2"
                  style={{
                    left: `${(points[hoveredPoint].x / width) * 100}%`,
                    top: `${(points[hoveredPoint].y / height) * 100 - 32}%`
                  }}
                >
                  <span className="font-semibold">{points[hoveredPoint].date} ({points[hoveredPoint].dayName}):</span>{" "}
                  {toFriendlyUnits(metricKey, points[hoveredPoint].val)}
                </div>
              )}
            </div>

            {/* Time Axis Labels */}
            <div className="flex justify-between text-[10px] text-[var(--text-muted)] px-1">
              <span>{activeData[0]?.date || ""}</span>
              <span>{timeRange === "7d" ? "Midweek" : "15d ago"}</span>
              <span className="font-semibold text-[var(--text-secondary)]">Today</span>
            </div>
          </div>

          {/* Under Chart: "What this means" (Exactly one sentence) */}
          <div className="mt-3 pt-2.5 border-t border-[var(--border-subtle)] text-xs">
            <span className="font-semibold text-[var(--text-primary)]">What this means: </span>
            <span className="text-[var(--text-secondary)] leading-relaxed">{meaningSentence}</span>
          </div>
        </div>
      );
    }

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape") onClose();
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);

      const handleExportCSV = () => {
        const headers = ["Date", "Longest stretch", "Midday break", "After-hours messages", "Typing speed", "Corrections", "Check-in"];
        const rows = telemetry7d.map(r => [
          r.date,
          toFriendlyUnits("stretch", r.stretch_mins),

          r.after_hours_msgs,
          `${r.wpm} WPM`,
          `${r.backspace_ratio}%`,
          r.bat_status || "Steady"

        const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");

    // (b) Tapping early unlocks form, sets early_checkin = true, saves timestamp
    // (c) After unlock time: primary button "Take today's check-in (about 2 minutes)"
    // (d) Also unlock automatically if tracking paused or no activity for 60m after 11:00 AM
    // (e) One submission per day; editable until midnight; afterwards show "Done today ✓" with "1.8 out of 5 (low)"
    // =========================================================================
    function CheckInCard({ summary, onOpenModal, isTrackingPaused = false, isInactiveAfter11AM = false }) {
      const [testOverride, setTestOverride] = useState(null); // null, "locked", "unlocked", "paused"

      const now = new Date();
      const realHour = now.getHours();

      let effectiveHour = realHour;
      let effectivePaused = isTrackingPaused;

      if (testOverride === "locked") {
        effectiveHour = 10;
        effectivePaused = false;
      } else if (testOverride === "unlocked") {
        effectiveHour = 14;
      } else if (testOverride === "paused") {
        effectivePaused = true;
      }

      // Rule (a) & (c): 1:00 PM local time (13:00)
      const isPastUnlockTime = effectiveHour >= 13;

      // Rule (d): Also unlock automatically if user pauses tracking or no activity for 60m after 11:00 AM
      const isUnlockedByInactivityOrPause = effectivePaused || (effectiveHour >= 11 && isInactiveAfter11AM);

      const isUnlocked = isPastUnlockTime || isUnlockedByInactivityOrPause;

      // Rule (e): One submission per day; editable until midnight; afterwards show "Done today ✓" with qualitative category badge
      const isDoneToday = summary && (summary.today_submitted || summary.submitted_at);
      const todayCategory = summary ? (summary.today_category || summary.today_score_text || getBatPercentileCategory(summary.today_score, "total")) : "Low";

      return (
        <div
          className="ws-card p-6 border-l-4 transition-all relative"
          style={{
            borderLeftColor: isDoneToday
              ? "var(--status-steady)"
              : isUnlocked
              ? "var(--primary)"
              : "var(--border-strong)"

              Timing rule status: {isDoneToday ? "Done today ✓" : isUnlocked ? "Unlocked (>= 1:00 PM / Inactivity)" : "Locked (< 1:00 PM)"}

            <div className="flex items-center gap-1">
              <span className="hidden sm:inline text-[10px]">Test state:</span>
              <button
                type="button"
                onClick={() => setTestOverride(testOverride === "locked" ? null : "locked")}
                className={`px-2 py-0.5 rounded text-[10px] transition-colors ${
                  testOverride === "locked"
                    ? "bg-[var(--status-strained)] text-white font-bold"
                    : "bg-[var(--bg-card-subtle)] hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)]"
                }`}
                title="Simulate 10:30 AM before shift midpoint (Locks card)"
              >
                10:30 AM (Lock)
              </button>
              <button
                type="button"
                onClick={() => setTestOverride(testOverride === "unlocked" ? null : "unlocked")}
                className={`px-2 py-0.5 rounded text-[10px] transition-colors ${
                  testOverride === "unlocked"
                    ? "bg-[var(--primary)] text-white font-bold"
                    : "bg-[var(--bg-card-subtle)] hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)]"
                }`}
                title="Simulate 2:00 PM after shift midpoint (Unlocks card)"
              >
                2:00 PM (Unlock)
              </button>
              <button
                type="button"
                onClick={() => setTestOverride(testOverride === "paused" ? null : "paused")}
                className={`px-2 py-0.5 rounded text-[10px] transition-colors ${
                  testOverride === "paused"
                    ? "bg-[var(--primary)] text-white font-bold"
                    : "bg-[var(--bg-card-subtle)] hover:bg-[var(--bg-card-hover)] text-[var(--text-muted)]"
                }`}
                title="Simulate tracking paused (Auto-unlock)"
              >
                Tracking Paused (Unlock)
              </button>
            </div>
          </div>

          {/* Card Body by State */}
          {isDoneToday ? (
            /* (e) COMPLETED TODAY */
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-semibold text-[var(--status-steady)] uppercase tracking-wider">
                    Day Check-in

                  {summary?.today_early_checkin && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-[var(--bg-card-subtle)] text-[var(--text-muted)] font-medium">
                      Early check-in
                    </span>
                  )}

                <h3 className="text-lg sm:text-xl font-bold text-[var(--text-primary)]">
                  How was your day?
                </h3>
                <div className="flex items-center gap-2 pt-1">
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-[var(--status-steady-bg)] text-[var(--status-steady)] border border-[var(--status-steady-border)]">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                    </svg>
                    Done today &check;
                  </span>
                  <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full border ${getCategoryBadgeClass(todayCategory)}`}>
                    {todayCategory}

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>

                </div>

              {/* (b) Beside it text button: "Logging off early? Check in now." */}

    // =========================================================================
    // CHECK-INS PAGE (Route /check-in)
    // Score history line chart and user's usual range ("Your usual check-in score: 1.5 (low)")
    // =========================================================================
    function EmployeeCheckInPageView({ data, onOpenModal }) {
      const [hoveredPoint, setHoveredPoint] = useState(null);

      if (!data) return <Skeleton count={3} />;

      const batSummary = data.bat12_summary || {};
      const history = batSummary.checkin_history || [];
      const usualCategory = batSummary.usual_checkin_category || batSummary.baseline_bat_status || "Low";
      const usualScoreText = `Your usual check-in: ${usualCategory}`;
      const usualVal = batSummary.usual_checkin_score || 1.5;
      const usualRange = batSummary.usual_range || { min: 1.2, max: 1.8 };

      // SVG Dimensions for Score History Chart
      const width = 740;
      const height = 180;
      const padTop = 20;
      const padBottom = 28;
      const padLeft = 32;
      const padRight = 24;
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const minScore = 1.0;
      const maxScore = 5.0;
      const rangeScore = maxScore - minScore;

      const getX = (idx) => padLeft + (idx / Math.max(1, history.length - 1)) * chartW;
      const getY = (val) => padTop + chartH - ((Math.max(minScore, Math.min(maxScore, val)) - minScore) / rangeScore) * chartH;

      // Usual Range Band Coordinates
      const bandTopY = getY(usualRange.max);
      const bandBottomY = getY(usualRange.min);
      const bandHeight = Math.max(6, bandBottomY - bandTopY);
      const usualLineY = getY(usualVal);

      // Points and Path
      const points = history.map((d, i) => {
        const cat = d.category || getBatPercentileCategory(d.score || 1.5, "total");
        return {
          x: getX(i),
          y: getY(d.score || 1.5),
          score: d.score || 1.5,
          category: cat,
          date: d.date,
          dayName: d.day_name,
          isWeekend: d.is_weekend,
          status: d.status || "Green"
        };
      });

      const linePath = points.length > 0
        ? points.reduce((acc, pt, i) => `${acc} ${i === 0 ? "M" : "L"} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`, "")
        : "";

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-[var(--text-primary)]">Day Check-in</h2>
              <p className="text-xs text-[var(--text-secondary)] mt-0.5">
                Daily 2-minute check-in reflecting on your energy, motivation, stress, and mental focus.

    // =========================================================================
    // SECTION 4: "WHAT'S BEHIND THIS"
    // =========================================================================
    function WhatsBehindThis({ primaryDrivers = [] }) {
      const plainSentences = {
        cognitive_and_focus_fatigue: "Your focus is being broken up more often",
        work_pattern_changes: "Long stretches without a break",
        boundary_erosion: "Messages sent after work hours",
        recovery_deficit: "Lunch break was skipped or shorter than usual",
        lunch_break: "Lunch break was skipped or shorter than usual",
        lunch_skipped: "Lunch break was skipped or shorter than usual"
      };

      const fallbackDefaults = [
        "Your focus is being broken up more often",
        "Long stretches without a break",
        "Messages sent after work hours"
      ];

      const rankedDrivers = useMemo(() => {
        if (!primaryDrivers || primaryDrivers.length === 0) {
          return [
            { rank: "Biggest", text: fallbackDefaults[0] },
            { rank: "Medium", text: fallbackDefaults[1] },
            { rank: "Small", text: fallbackDefaults[2] },
          ];
        }
        const ranks = ["Biggest", "Medium", "Small"];
        return primaryDrivers.slice(0, 3).map((d, i) => ({
          rank: ranks[i] || "Small",
          text: plainSentences[d.category_key] || d.label || fallbackDefaults[i]
        }));
      }, [primaryDrivers]);

      return (
        <div className="ws-card p-6">
          <h3 className="text-base font-semibold text-[var(--text-primary)] mb-1">What's behind this</h3>
          <p className="text-xs text-[var(--text-secondary)] mb-4">
            The main behavioral shifts detected across your recent desktop activity.
          </p>

          <div className="space-y-2.5">
            {rankedDrivers.map((item, idx) => (
              <div
                key={idx}
                className="flex items-center gap-3 p-3 rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-card)]"
              >
                <span
                  className="px-2.5 py-1 rounded-md text-[11px] font-semibold shrink-0"
                  style={{
                    backgroundColor: idx === 0 ? "var(--status-strained-bg)" : "var(--bg-card-subtle)",
                    color: idx === 0 ? "var(--status-strained)" : "var(--text-secondary)"
                  }}
                >
                  {item.rank}
                </span>
                <span className="text-xs font-medium text-[var(--text-primary)] leading-normal">
                  {item.text}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 5: "HOW TODAY COMPARES WITH YOUR USUAL"
    // =========================================================================
    function HowTodayCompares({ deviations = {}, telemetry = [] }) {
      const todayTelemetry = telemetry[telemetry.length - 1] || {};

      const allMetrics = [
        {
          key: "work_stretch",
          value: deviations.work_stretch || 0,
          displayLabel: "Longest stretch",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.stretch_mins || 153} mins`
        },
        {
          key: "after_hours",
          value: deviations.after_hours || 0,
          displayLabel: "After-hours communication",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.after_hours_msgs || 21} msgs`
        },
        {
          key: "lunch_break",
          value: deviations.lunch_break || 0,
          displayLabel: "Lunch break duration",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.lunch_mins || 8} mins`
        },
        {
          key: "typing_speed",
          value: deviations.typing_speed || 0,
          displayLabel: "Typing pace changed",
          isAmbiguous: true,
          hoverMetric: `Today: ${todayTelemetry.wpm || 24} WPM`
        },
        {
          key: "error_rate",
          value: deviations.error_rate || 0,
          displayLabel: "Correction errors",
          isAmbiguous: false,
          hoverMetric: `Today: ${todayTelemetry.backspace_ratio || 22}% corrections`
        },
        {
          key: "focus_fragmentation",
          value: deviations.focus_fragmentation || 0,
          displayLabel: "Focus fragmentation",
          isAmbiguous: false,
          hoverMetric: `Today: elevated task switching`
        }
      ];

      const top3Metrics = useMemo(() => {
        return [...allMetrics]
          .sort((a, b) => Math.abs(b.value) - Math.abs(a.value))
          .slice(0, 3);
      }, [deviations, todayTelemetry]);

      return (
        <div className="ws-card p-6">
          <div className="flex items-center justify-between mb-1">
            <h3 className="text-base font-semibold text-[var(--text-primary)]">How today compares with your usual</h3>
            <span className="text-[11px] text-[var(--text-muted)]">Top 3 shifts &bull; Hover for details</span>
          </div>
          <p className="text-xs text-[var(--text-secondary)] mb-4">
            Comparison against your 14-day calibrated personal baseline.
          </p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {top3Metrics.map((item) => (
              <DeviationBar key={item.key} item={item} />
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 6: ONE SUGGESTION TIED TO TOP CONTRIBUTOR
    // =========================================================================
    function TopContributorSuggestion({ outlookStatus = "Green", primaryDrivers = [] }) {
      const topDriver = primaryDrivers && primaryDrivers.length > 0 ? primaryDrivers[0].category_key : "work_pattern_changes";

      let suggestion = "You've had three long stretches this week. Try a 5-minute break every 90 minutes.";

      if (topDriver === "work_pattern_changes") {
        suggestion = outlookStatus === "Green"
          ? "Your session lengths are well-spaced today. Keep taking short micro-breaks between deep focus tasks."
          : "You've had three long stretches this week. Try a 5-minute break every 90 minutes.";
      } else if (topDriver === "boundary_erosion") {
        suggestion = outlookStatus === "Green"
          ? "You maintained firm evening boundaries today. Protect your restful evening."
          : "Late-night messages have increased this week. Try setting an auto-responder or closing communication apps by 7 PM.";
      } else if (topDriver === "cognitive_and_focus_fatigue") {
        suggestion = outlookStatus === "Green"
          ? "Your typing rhythm and focus blocks were steady throughout the workday."
          : "Your work focus has been broken up more often. Consider blocking a 45-minute uninterrupted quiet block tomorrow.";
      } else if (topDriver === "recovery_deficit" || topDriver === "lunch_break" || topDriver === "lunch_skipped") {
        suggestion = outlookStatus === "Green"
          ? "You took a proper lunch break today."
          : "Your lunch breaks were unusually short this week. Try taking a full 30-minute screen-free lunch away from your desk.";
      }

      return (
        <div className="ws-card p-5 border-l-4" style={{ borderLeftColor: "var(--primary)" }}>
          <div className="flex items-start gap-3">
            <div className="p-2 rounded-xl bg-[var(--primary-subtle)] text-[var(--primary)] shrink-0">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
            <div>
              <span className="text-[11px] font-semibold text-[var(--primary)] uppercase tracking-wider">
                Personalized suggestion
              </span>
              <p className="text-sm font-medium text-[var(--text-primary)] mt-0.5 leading-relaxed">
                {suggestion}
              </p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================

              let dotColor = "var(--border-strong)";

              if (!isWeekend) {

              return (
