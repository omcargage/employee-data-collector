services:
  db:
    image: postgres:16-alpine
    container_name: edc-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edc_password}
      POSTGRES_DB: ${POSTGRES_DB:-edc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edc_user} -d ${POSTGRES_DB:-edc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
